<app-workspace-header
  [title]="symbol()"
  [breadcrumb]="breadcrumb()"
  [secondaryActions]="headerActions()"
  (actionTriggered)="onHeaderAction($event)"
>
  <app-how-this-works workspaceHelp route="/data-lab-docs" />
  <div workspaceFacts class="instrument-facts">
    @if (admitted().kind === 'ready') {
      <app-asset-identity [symbol]="symbol()" [name]="admittedName()" size="sm" />
    }
  </div>
</app-workspace-header>

@if (stateContent(); as state) {
  <app-workspace-state-block [state]="state" (actionTriggered)="onAction($event)" />
} @else {
  @if (ignoredNotes().length > 0) {
    <app-migration-notice heading="Migrated link." [notes]="ignoredNotes()" (dismissed)="dismissIgnored()" />
  }
  @if (setups.notes().length > 0) {
    <app-migration-notice heading="Saved setup." [notes]="setups.notes()" (dismissed)="setups.clearNotes()" />
  }
  @if (setupsOpen()) {
    <app-saved-setups (closed)="setupsOpen.set(false)" />
  }
  <app-instrument-context-bar />
  <app-workspace-tab-list label="Instrument sections" [tabs]="tabs()" [activeId]="activeTab()" />
  <div class="instrument-body">
    @if (setups.pending()) {
      <app-workspace-state-block [state]="openingState" />
    } @else if (contextState(); as state) {
      <app-workspace-state-block [state]="state" />
    } @else {
      <router-outlet />
    }
  </div>
}

<app-run-dock />
