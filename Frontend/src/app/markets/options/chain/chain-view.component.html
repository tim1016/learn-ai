<section class="chain" aria-label="Chain">
  @if (again()) {
    <p class="muted" role="status">Reading again. What is shown is the last answer.</p>
  }
  <app-chain-facts [facts]="chain().facts" [notes]="chain().notes" />
  @if (chain().crossCheck; as crossCheck) {
    <app-chain-cross-check [crossCheck]="crossCheck" />
  }
  @if (state(); as content) {
    <app-workspace-state-block [state]="content" (actionTriggered)="actionTriggered.emit($event)" />
  } @else {
    <app-chain-grid [table]="chain().table" [underlying]="chain().underlying" />
  }
</section>
