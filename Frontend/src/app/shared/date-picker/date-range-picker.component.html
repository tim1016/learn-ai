<div class="date-range" role="group" [attr.aria-label]="label()">
  <div class="date-range__fields" #anchor>
    <input
      #fromInput
      type="text"
      class="date-control__input mono"
      inputmode="numeric"
      autocomplete="off"
      spellcheck="false"
      placeholder="YYYY-MM-DD"
      aria-label="Start date"
      [value]="fromText()"
      [attr.aria-invalid]="checked().from.problem !== null"
      [attr.aria-describedby]="noteId"
      (change)="applyFrom(fromInput.value)"
      (keydown.enter)="applyFrom(fromInput.value)"
    />
    <i class="pi pi-arrow-right date-range__arrow" aria-hidden="true"></i>
    <input
      #toInput
      type="text"
      class="date-control__input mono"
      inputmode="numeric"
      autocomplete="off"
      spellcheck="false"
      placeholder="YYYY-MM-DD"
      aria-label="End date"
      [value]="toText()"
      [attr.aria-invalid]="checked().to.problem !== null"
      [attr.aria-describedby]="noteId"
      (change)="applyTo(toInput.value)"
      (keydown.enter)="applyTo(toInput.value)"
    />
    <button type="button" class="date-control__open" aria-label="Open the calendar" aria-haspopup="dialog" (click)="popover.toggle($event, anchor)">
      <i class="pi pi-calendar" aria-hidden="true"></i>
    </button>
  </div>

  @if (offers().length > 0) {
    <div class="date-range__ranges" role="group" aria-label="Quick ranges">
      @for (offer of offers(); track offer.key) {
        <button
          type="button"
          class="date-control__choice date-range__range"
          [class.date-range__range--active]="active().has(offer.key)"
          [attr.aria-pressed]="active().has(offer.key)"
          [attr.aria-disabled]="offer.unavailable !== null"
          [attr.aria-label]="offerName(offer)"
          [pTooltip]="offer.unavailable ?? offer.note"
          tooltipEvent="both"
          tooltipPosition="top"
          (click)="applyOffer(offer)"
        >
          {{ offer.key }}
        </button>
      }
    </div>
  }

  <p class="date-control__note" [id]="noteId" [class.date-control__note--problem]="problem() !== null || calendarProblem() !== null" aria-live="polite">
    @if (problem(); as message) {
      {{ message }}
    } @else if (calendarProblem(); as message) {
      The trading calendar could not be read: {{ message }}
      <button type="button" class="date-control__retry" (click)="retryCalendar()">Retry</button>
    } @else {
      {{ summary() }}
    }
  </p>

  <p-popover #popover ariaLabel="Calendar">
    <!-- A template, so the two months are built when the calendar opens and not with every picker on the page. -->
    <ng-template #content>
      <app-date-calendar
        mode="range"
        [from]="checked().from.date"
        [to]="checked().to.date"
        [bounds]="bounds()"
        [sessions]="sessions()"
        [marked]="unheldDays()"
        (picked)="setRange($event); popover.hide()"
      />
    </ng-template>
  </p-popover>
</div>
