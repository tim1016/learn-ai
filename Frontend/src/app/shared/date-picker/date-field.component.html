<span class="date-field" #anchor>
  <input
    #field
    type="text"
    class="date-control__input mono"
    inputmode="numeric"
    autocomplete="off"
    spellcheck="false"
    placeholder="YYYY-MM-DD"
    [attr.id]="inputId()"
    [value]="text()"
    [attr.aria-invalid]="problem() !== null"
    [attr.aria-describedby]="problem() === null ? null : noteId"
    [disabled]="disabled()"
    (change)="apply(field.value)"
    (keydown.enter)="apply(field.value)"
    (blur)="touch.emit()"
  />
  <button
    #opener
    type="button"
    class="date-control__open"
    aria-label="Open the calendar"
    [attr.aria-haspopup]="calendar() === 'inline' ? null : 'dialog'"
    [attr.aria-expanded]="calendar() === 'inline' ? open() : null"
    [disabled]="disabled()"
    (click)="toggleCalendar($event, anchor)"
  >
    <i class="pi pi-calendar" aria-hidden="true"></i>
  </button>
</span>
@if (problem(); as message) {
  <p class="date-control__note date-control__note--problem" [id]="noteId" role="alert">{{ message }}</p>
}
@if (offers().length > 0) {
  <div class="date-field__offers" role="group" aria-label="Dates that fit">
    @for (date of offers(); track date) {
      <button type="button" class="date-control__choice date-field__offer mono" (click)="takeOffer(date)">Use {{ date }}</button>
    }
  </div>
}
@if (calendar() === 'inline') {
  @if (open()) {
    <div class="date-field__inline" role="group" aria-label="Calendar" (keydown.escape)="dismissCalendar()">
      <app-date-calendar [from]="entry().date" [bounds]="calendarBounds()" (picked)="pick($event.from)" />
    </div>
  }
} @else {
  <p-popover ariaLabel="Calendar">
    <!-- A template, so the month is built when the calendar opens and not with every field on the page. -->
    <ng-template #content>
      <app-date-calendar [from]="entry().date" [bounds]="calendarBounds()" (picked)="pick($event.from)" />
    </ng-template>
  </p-popover>
}
