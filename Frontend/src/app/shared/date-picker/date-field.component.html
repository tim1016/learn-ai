<span class="date-field" #anchor>
  <input
    #field
    type="text"
    class="date-control__input mono"
    inputmode="numeric"
    autocomplete="off"
    spellcheck="false"
    maxlength="10"
    placeholder="YYYY-MM-DD"
    [attr.id]="inputId()"
    [attr.aria-label]="label()"
    [value]="text()"
    [attr.aria-invalid]="problem() !== null"
    [attr.aria-describedby]="problem() === null ? null : noteId"
    (change)="text.set(field.value.trim())"
  />
  <button type="button" class="date-control__open" aria-label="Open the calendar" aria-haspopup="dialog" (click)="popover.toggle($event, anchor)">
    <i class="pi pi-calendar" aria-hidden="true"></i>
  </button>
</span>
@if (problem(); as message) {
  <p class="date-control__note date-control__note--problem" [id]="noteId" role="alert">{{ message }}</p>
}
<p-popover #popover ariaLabel="Calendar">
  <app-date-calendar [from]="checked().date" [bounds]="bounds()" [sessions]="sessions()" (picked)="text.set($event.from); popover.hide()" />
</p-popover>
