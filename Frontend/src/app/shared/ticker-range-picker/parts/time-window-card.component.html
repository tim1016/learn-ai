<section class="group time-window" [class.group--flat]="appearance() === 'flat'" aria-label="Time window">
  <header class="group__head">
    <span class="group__eyebrow">
      <span class="group__eyebrow-dot group__eyebrow-dot--bull"></span>
      Time window
    </span>
  </header>

  <app-date-range-picker
    label="Dates"
    [from]="value().from"
    [to]="value().to"
    [bounds]="bounds()"
    [gaps]="gaps()"
    [sessionsOnly]="sessionsOnly()"
    (changed)="setDates($event)"
  />
</section>
