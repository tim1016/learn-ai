<section class="group time-window"
         [class.group--flat]="appearance() === 'flat'"
         aria-label="Time window">
  <header class="group__head">
    <span class="group__eyebrow">
      <span class="group__eyebrow-dot group__eyebrow-dot--bull"></span>
      Time window
    </span>
    <span class="group__helper mono">{{ spanDays() }}d · {{ spanBusinessDays() }}bd</span>
  </header>

  <div class="range-row">
    <input
      type="date"
      class="range-row__input mono"
      [value]="value().from"
      (input)="updateFromEvent($event)"
      aria-label="Start date"
    />
    <i class="pi pi-arrow-right range-row__arrow" aria-hidden="true"></i>
    <input
      type="date"
      class="range-row__input mono"
      [value]="value().to"
      (input)="updateToEvent($event)"
      aria-label="End date"
    />
  </div>

  <div class="presets" role="group" aria-label="Quick ranges">
    @for (p of presets; track p.days) {
      <button
        type="button"
        class="preset-btn"
        [class.preset-btn--active]="activePreset() === p.days"
        (click)="applyPreset(p.days)"
      >
        {{ p.label }}
      </button>
    }
  </div>
</section>
