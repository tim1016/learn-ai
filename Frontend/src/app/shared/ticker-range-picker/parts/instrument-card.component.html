<section #rootEl class="group" [class.group--flat]="appearance() === 'flat'" aria-label="Instrument">
  <header class="group__head">
    <span class="group__eyebrow">
      <span class="group__eyebrow-dot group__eyebrow-dot--accent"></span>
      Instrument
    </span>
    <span class="group__helper mono">{{ selectedExchange() }}</span>
  </header>

  <div class="ticker-box-wrap">
    <div
      class="ticker-box"
      role="combobox"
      tabindex="0"
      [class.ticker-box--open]="open()"
      [attr.aria-expanded]="open()"
      aria-haspopup="listbox"
      aria-controls="ticker-range-picker-listbox"
      (click)="openDropdown()"
      (keydown.enter)="onTickerBoxEnter($event)"
      (keydown.space)="onTickerBoxSpace($event)"
      (keydown.escape)="closeDropdown()"
    >
      <i class="pi pi-search ticker-box__icon" aria-hidden="true"></i>
      @if (!open()) {
        <app-asset-identity
          class="ticker-box__identity"
          [symbol]="value().symbol"
          size="sm"
          [showTitle]="false"
        />
        <span class="ticker-box__name">
          {{ selectedTicker()?.name || '' }}
        </span>
        <span class="ticker-box__chip mono"
              [pTooltip]="selectedExchangeTooltip()"
              tooltipPosition="top"
              tabindex="0"
              role="img"
              [attr.aria-label]="selectedExchangeTooltip()">{{ selectedExchange() }}</span>
        <i class="pi pi-angle-down ticker-box__chev" aria-hidden="true"></i>
      } @else {
        <input
          type="text"
          class="ticker-box__input mono"
          placeholder="Search symbol or name…"
          [value]="query()"
          (input)="onSearchInputEvent($event)"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
          #searchInput
        />
      }

      @if (open()) {
        <app-instrument-dropdown
          [visible]="visibleTickers()"
          [recent]="recentTickers()"
          [matchCount]="filteredTickers().length"
          [activeSymbol]="value().symbol"
          [query]="query()"
          [loading]="catalogLoading()"
          [unavailable]="catalogUnavailable()"
          [degraded]="catalogDegraded()"
          [empty]="catalogEmpty()"
          [hostUniverse]="hostUniverse()"
          [gate]="gateState()"
          (pick)="pickTicker($event)"
          (retryLake)="retryCatalog()"
          (retryVendor)="retryVendorCatalog()"
          (retryGate)="retryGate()"
          (dismiss)="closeGate()"
        />
      }
    </div>
  </div>

  @if (selectedLastHeld(); as lastHeld) {
    <div
      class="instrument-foot mono"
      title="First and last day the lake holds for this symbol. Days in between may still be missing."
    >
      <span class="instrument-foot__label">days held</span>
      <span class="instrument-foot__span">
        @if (selectedFirstHeld(); as firstHeld) {
          <span class="instrument-foot__span-val">{{ firstHeld }}</span> →
        }
        <span class="instrument-foot__span-val">{{ lastHeld }}</span>
      </span>
    </div>
  }
</section>
