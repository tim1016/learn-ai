<section class="group" aria-label="Instrument universe">
  <header class="group__head">
    <span class="group__eyebrow">
      <span class="group__eyebrow-dot group__eyebrow-dot--accent"></span>
      Instrument
      <span class="group__count mono"
        >({{ symbols().length }}/{{ options().length }})</span
      >
    </span>
    <span class="group__actions">
      <button
        type="button"
        class="link-btn"
        [disabled]="selectAllDisabled()"
        [attr.title]="selectAllTitle()"
        (click)="selectAll()"
      >
        All
      </button>
      <button type="button" class="link-btn" (click)="selectNone()">
        None
      </button>
    </span>
  </header>

  @if (loading()) {
    <p class="catalog-note" role="status" aria-live="polite">
      Loading instruments…
    </p>
  } @else if (unavailable(); as reason) {
    <p class="catalog-note" role="status" aria-live="polite">
      {{ reason }}
      <button type="button" class="link-btn" (click)="retry.emit()">
        Retry
      </button>
    </p>
  } @else if (options().length === 0) {
    <p class="catalog-note" role="status" aria-live="polite">
      No instruments available.
    </p>
  }

  <div class="chips-row">
    @for (s of symbols(); track s) {
      <button
        type="button"
        class="chip"
        (click)="remove(s)"
        [attr.aria-label]="s + ' (remove)'"
      >
        <span class="chip__symbol mono">{{ s }}</span>
        <span class="chip__remove" aria-hidden="true">×</span>
      </button>
    }
  </div>

  <app-multi-instrument-search
    [options]="options()"
    [selected]="symbols()"
    (picked)="add($event)"
  />
</section>
