<section
  class="trading-chart"
  [class.trading-chart--expanded]="expanded()"
  [attr.data-pane-count]="panes().length"
  aria-label="Shared-time-scale strategy chart"
>
  <header class="trading-chart__header">
    @if (quote(); as tickerQuote) {
      <app-ticker-quote [quote]="tickerQuote" tone="inverse" />
    }
    <span class="trading-chart__timeframe">{{ timeframeLabel() }}</span>
    <div class="trading-chart__chips" aria-label="Active indicators">
      @for (indicator of activeIndicators(); track indicator.id) {
        <span class="trading-chart__chip">
          <i [style.background]="indicator.color" aria-hidden="true"></i>
          {{ indicator.label }}
          <button
            type="button"
            [attr.aria-label]="'Remove ' + indicator.label"
            (click)="indicatorRemoved.emit(indicator.id)"
          >×</button>
        </span>
      }
    </div>
    <button
      type="button"
      class="trading-chart__expand"
      [attr.aria-label]="expanded() ? 'Exit expanded chart' : 'Expand chart'"
      [attr.aria-pressed]="expanded()"
      (click)="toggleExpanded()"
    ><i class="pi" [class.pi-window-maximize]="!expanded()" [class.pi-window-minimize]="expanded()" aria-hidden="true"></i></button>
  </header>

  <div class="trading-chart__pane-legend" aria-label="Chart pane descriptions">
    @for (pane of panes(); track pane.id) {
      <div class="trading-chart__pane-legend-item">
        <strong>{{ pane.label }}</strong>
        <span>{{ pane.description }}</span>
      </div>
    }
  </div>

  <div class="trading-chart__body">
    <div class="trading-chart__canvas-wrap">
      <div #chartCanvas class="trading-chart__canvas" [style.--chart-height.px]="chartHeight()"></div>
      <a
        class="trading-chart__attribution sr-only"
        href="https://www.tradingview.com/"
        target="_blank"
        rel="noopener noreferrer"
      >Charts by TradingView</a>
    </div>

    @if (expanded()) {
      <app-chart-indicator-rail
        class="trading-chart__rail"
        [activeIndicators]="activeIndicators()"
        [categories]="indicatorCategories()"
        [catalogLoading]="indicatorCatalogLoading()"
        (indicatorAdded)="onIndicatorAdded($event)"
        (indicatorRemoved)="indicatorRemoved.emit($event)"
      />
    }
  </div>
</section>
