@if (optionContract(); as contract) {
  <app-option-contract [contract]="contract" [market]="optionMarket()" [size]="size()" />
} @else {
  <app-asset-wordmark
    [symbol]="symbol()" [name]="name()" [exchange]="exchange()"
    [logoSlug]="logoSlug()" [logo]="logo()" [size]="size()"
    [tone]="tone()" [showTitle]="false"
  />
}
