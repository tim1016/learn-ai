<nav class="workspace-tabs" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.id) {
    @if (tab.route; as route) {
      <a
        class="workspace-tab"
        [class.is-active]="tab.id === activeId()"
        [attr.aria-current]="tab.id === activeId() ? 'page' : null"
        [routerLink]="route"
        [queryParams]="tab.queryParams"
      >{{ tab.label }}@if (tab.badge; as badge) { <span class="workspace-tab__badge">{{ badge }}</span> }</a>
    } @else {
      <span class="workspace-tab workspace-tab--unavailable" aria-disabled="true" [attr.title]="tab.unavailableReason ?? null">
        {{ tab.label }}
        @if (tab.unavailableReason; as reason) {
          <span class="workspace-tab__reason"> — {{ reason }}</span>
        }
      </span>
    }
  }
</nav>
