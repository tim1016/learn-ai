<form class="backfill" (submit)="$event.preventDefault(); submit()">
  <div class="backfill__fields">
    <div class="field field--picker">
      @if (catalogLoading()) {
        <p class="backfill__note" role="status" aria-live="polite">Loading symbol catalog…</p>
      } @else if (catalogUnavailable(); as reason) {
        <p class="backfill__note" role="status" aria-live="polite">
          Live symbol catalog unavailable — {{ reason }}
          <button type="button" class="backfill__retry" (click)="retryCatalog()">Retry</button>
        </p>
      }
      <app-multi-instrument-card
        [(value)]="selected"
        [universe]="pickerUniverse()"
      />
    </div>
    <div class="field">
      <label for="backfill-start">Backfill start date</label>
      <input
        id="backfill-start"
        class="field__input"
        type="date"
        [value]="startTradingDate()"
        (input)="onStart($event)"
      />
    </div>
    <div class="field">
      <label for="backfill-end">Backfill end date</label>
      <input
        id="backfill-end"
        class="field__input"
        type="date"
        [value]="endTradingDate()"
        (input)="onEnd($event)"
      />
    </div>
    <div class="field field--check">
      <input id="backfill-quotes" type="checkbox" [checked]="includeQuotes()" (change)="onIncludeQuotes($event)" />
      <label for="backfill-quotes">Also derive quote bars</label>
    </div>
    <div class="field field--check">
      <input id="backfill-delisted" type="checkbox" [checked]="includeDelisted()" (change)="onIncludeDelisted($event)" />
      <label for="backfill-delisted">Include delisted symbols</label>
    </div>
  </div>

  @if (blockedReason(); as reason) {
    <p class="backfill__note" role="status">{{ reason }}</p>
  }

  <div class="backfill__actions">
    <button type="submit" class="backfill__submit" [disabled]="!canSubmit()">Run backfill</button>
    @if (store.running()) {
      <button type="button" class="backfill__cancel" (click)="cancel()">Cancel</button>
    }
    <span class="backfill__phase">{{ store.phase() | receiptLabel }}</span>
  </div>

  <app-backfill-run-log
    [phase]="store.phase()"
    [percent]="percent()"
    [progress]="store.progress()"
    [days]="store.days()"
    [failures]="store.failures()"
    [error]="store.error()"
    [jobId]="store.jobId()"
    [reattached]="store.reattached()"
  />
</form>
