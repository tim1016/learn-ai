<section class="run-report">
  @if (loading()) {
    <div class="run-report__empty">Loading run…</div>
  } @else if (run(); as currentRun) {
    @if (engineResult(); as result) {
      <app-strategy-lab-verdict
        [verdict]="verdict()"
        [parity]="parity()"
        [tradeCount]="currentRun.totalTrades"
        (rerun)="rerun.emit()"
      />

      <app-strategy-lab-metrics [result]="result" />

      @if (reportNotice(); as notice) {
        <p class="run-report__notice" role="note">{{ notice }}</p>
      }

      <app-strategy-lab-chart
        [run]="currentRun"
        [candles]="candles()"
        [markers]="markers()"
        [equityPoints]="equityPoints()"
      />

      <app-strategy-lab-deep-dives
        [result]="result"
        [commissionPerOrder]="currentRun.commissionPerOrder"
      />
    }
  } @else {
    <div class="run-report__empty">Run not found.</div>
  }
</section>
