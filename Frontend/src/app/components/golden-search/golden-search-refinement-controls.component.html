@let p = protocol();
<details>
  <summary>Search order and refinement controls</summary>
  @if (p.method === 'zoom') {
    <div class="fields">
      <label class="field"><span>Points per round</span><input #points pInputText type="number" min="3" max="9" step="1" [value]="p.zoom.points" [attr.aria-invalid]="numberInvalid('zoom_points')" (input)="onNumber('zoom_points', points.value)" /></label>
      <label class="field"><span>Refinement rounds</span><input #refinements pInputText type="number" min="0" max="4" step="1" [value]="p.zoom.refinements" [attr.aria-invalid]="numberInvalid('zoom_refinements')" (input)="onNumber('zoom_refinements', refinements.value)" /></label>
      <label class="field"><span>Maximum passes</span><input #passes pInputText type="number" min="1" max="5" step="1" [value]="p.zoom.passes" [attr.aria-invalid]="numberInvalid('zoom_passes')" (input)="onNumber('zoom_passes', passes.value)" /></label>
    </div>
  }
  <fieldset class="audits">
    <legend>Audits</legend>
    @for (option of pairOptions(); track option.label) {
      <label class="check"><input type="checkbox" [checked]="option.included" (change)="onPair(option.pair, $event)" /><span>Pair grid: {{ option.label }}</span></label>
    }
    <label class="check"><input type="checkbox" [checked]="p.neighbor_audit" (change)="onFlag('neighbor_audit', $event)" /><span>Neighbor audit (each searched knob one step either side)</span></label>
  </fieldset>
  <div class="fields">
    <label class="field"><span>Backtest cap (at most 5,000)</span><input #cap pInputText type="number" min="1" max="5000" step="1" [value]="p.budget_cap" [attr.aria-invalid]="numberInvalid('budget_cap')" (input)="onNumber('budget_cap', cap.value)" /></label>
  </div>
  <p class="hint">Pair audits are counted in the workload. The search order is the knob table's order.</p>
</details>
