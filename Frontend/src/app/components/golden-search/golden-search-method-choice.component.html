<fieldset class="methods" [disabled]="readonly()">
  <legend class="sr-only">Search method</legend>
  @for (option of methods; track option.id) {
    <label class="method" [class.method--chosen]="option.id === method()">
      <input type="radio" name="golden-search-method" [value]="option.id" [checked]="option.id === method()" (change)="methodChange.emit(option.id)" />
      <span>{{ option.title }}</span>
    </label>
  }
</fieldset>
