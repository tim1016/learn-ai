@let p = protocol();
<section class="card" aria-labelledby="gs-judge-title">
  <div class="card__head">
    <div>
      <h3 id="gs-judge-title">How to judge</h3>
      <p class="hint">A candidate that breaks any of these rules is rejected, whatever its score.</p>
    </div>
  </div>
  <div class="fields">
    <label class="field"><span>Rank by</span>
      <select (change)="onObjective($event)" aria-label="Rank by">
        @for (measure of measures; track measure) { <option [value]="measure" [selected]="measure === p.policy.objective">{{ measure | receiptLabel }}</option> }
      </select>
    </label>
    <label class="field"><span>Max drawdown (% of peak equity)</span><input #ceiling pInputText type="number" min="0" max="100" step="0.5" [id]="inputId('drawdown_percent')" [value]="drawdownPercent()" [attr.aria-invalid]="numberInvalid('drawdown_percent')" (input)="onNumber('drawdown_percent', ceiling.value)" /></label>
    <label class="field"><span>Min completed trades</span><input #minTrades pInputText type="number" min="1" step="1" [id]="inputId('min_trades')" [value]="p.policy.min_trades" [attr.aria-invalid]="numberInvalid('min_trades')" (input)="onNumber('min_trades', minTrades.value)" /></label>
  </div>
  <label class="check"><input type="checkbox" [checked]="p.policy.require_positive_net" (change)="onFlag('require_positive_net', $event)" /><span>Require a positive net result</span></label>
  <p class="hint">{{ p.policy.min_trades }} trades is a starting policy, not a guarantee of statistical confidence; a sparse final test can end as “not enough evidence.”</p>
</section>
