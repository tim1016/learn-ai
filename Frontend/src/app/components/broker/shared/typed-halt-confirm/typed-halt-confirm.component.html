@if (open()) {
  <button
    type="button"
    class="backdrop"
    aria-label="Cancel"
    data-testid="typed-halt-confirm-backdrop"
    (click)="onCancel()"
  ></button>
  <!-- The click handler only keeps clicks inside the dialog from reaching the
       page behind it; it is not an action. Keys are contained by the host. -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
  <aside
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="typed-halt-confirm-heading"
    data-testid="typed-halt-confirm-dialog"
    (click)="$event.stopPropagation()"
  >
    <header>
      <h2 id="typed-halt-confirm-heading">{{ heading() }}</h2>
      @if (accountId(); as account) {
        <p class="account">Account <strong>{{ account }}</strong></p>
      }
    </header>
    <div class="message">
      @if (assetSymbol(); as symbol) {
        <app-asset-identity [symbol]="symbol" size="sm" />
      }
      <span>{{ message() }}</span>
    </div>
    <p class="consequence">{{ consequence() }}</p>
    @if (requiredToken()) {
      <label class="field">
        <span class="label">Type <code>{{ requiredToken() }}</code> to confirm</span>
        <input
          #tokenInput
          type="text"
          autocomplete="off"
          spellcheck="false"
          data-testid="typed-halt-confirm-input"
          (input)="onTokenInput($event)"
        />
      </label>
    }
    <footer>
      <button
        #cancelButton
        type="button"
        class="btn-ghost"
        data-testid="typed-halt-confirm-cancel"
        (click)="onCancel()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="btn-danger"
        data-testid="typed-halt-confirm-submit"
        [disabled]="!canConfirm()"
        (click)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </footer>
  </aside>
}
