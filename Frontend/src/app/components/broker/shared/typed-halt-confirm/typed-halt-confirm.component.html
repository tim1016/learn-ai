@if (open()) {
  <button
    type="button"
    class="backdrop"
    aria-label="Cancel"
    data-testid="typed-halt-confirm-backdrop"
    (click)="onCancel()"
  ></button>
  <!-- Keystrokes stop at the dialog so an enclosing menu that also closes on
       Escape does not act on them. That also hides them from the document
       Escape listener, so Escape cancels from here while focus is inside. -->
  <aside
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="typed-halt-confirm-heading"
    data-testid="typed-halt-confirm-dialog"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    (keydown.escape)="onEscape()"
  >
    <header>
      <h2 id="typed-halt-confirm-heading">{{ heading() }}</h2>
      @if (accountId(); as account) {
        <p class="account">Account <strong>{{ account }}</strong></p>
      }
    </header>
    <div class="message">
      @if (assetSymbol(); as symbol) {
        <app-asset-identity [symbol]="symbol" size="sm" />
      }
      <span>{{ message() }}</span>
    </div>
    <p class="consequence">{{ consequence() }}</p>
    @if (requiredToken()) {
      <label class="field">
        <span class="label">Type <code>{{ requiredToken() }}</code> to confirm</span>
        <input
          #tokenInput
          type="text"
          autocomplete="off"
          spellcheck="false"
          data-testid="typed-halt-confirm-input"
          (input)="onTokenInput($event)"
        />
      </label>
    }
    <footer>
      <button
        #cancelButton
        type="button"
        class="btn-ghost"
        data-testid="typed-halt-confirm-cancel"
        (click)="onCancel()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="btn-danger"
        data-testid="typed-halt-confirm-submit"
        [disabled]="!canConfirm()"
        (click)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </footer>
  </aside>
}
