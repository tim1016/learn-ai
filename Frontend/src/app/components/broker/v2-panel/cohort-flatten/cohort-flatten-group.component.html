<section class="cohort-flatten__group" [class.cohort-flatten__group--active]="active()">
  <h3>
    <span>{{ cohort().strategy_label }}</span>
    <app-asset-identity [symbol]="cohort().symbol" size="sm" />
    <span class="cohort-flatten__count">
      {{ copy.armedCount(cohort().enabled_count, cohort().legs.length) }}
    </span>
  </h3>
  @if (!active()) {
    <button
      type="button"
      class="cohort-flatten__choose"
      [disabled]="cohort().enabled_count === 0"
      [attr.aria-label]="copy.selectCohortLabel(cohort().strategy_label, cohort().symbol)"
      (click)="chosen.emit()"
    >
      {{ copy.selectCohort }}
    </button>
  }
  <ul>
    @for (leg of cohort().legs; track leg.strategy_instance_id) {
      <li [class.cohort-flatten__leg--blocked]="!leg.enabled">
        <label>
          <input
            type="checkbox"
            [checked]="isSelected(leg)"
            [disabled]="!leg.enabled || !active() || (capReached() && !isSelected(leg))"
            (change)="toggled.emit(leg)"
          />
          <code>{{ leg.strategy_instance_id }}</code>
        </label>
        <span class="cohort-flatten__exposure">{{ copy.exposure(leg.exposure) }}</span>
        @if (leg.blocker_headline; as blocker) {
          <span class="cohort-flatten__blocker">{{ blocker }}</span>
        }
      </li>
    }
  </ul>
</section>
