<div class="panel-action">
  <button
    type="button"
    [class]="'panel-action__button panel-action__button--' + tone()"
    [attr.aria-disabled]="disabled()"
    [attr.aria-busy]="pending()"
    [attr.aria-label]="action().label"
    [attr.aria-describedby]="visibleBlockers().length > 0 ? blockerDescriptionId : null"
    [title]="tooltip()"
    (click)="trigger()"
  >
    {{ action().label }}
    @if (visibleBlockers().length > 0) {
      <span [id]="blockerDescriptionId" class="sr-only">{{ tooltip() }}</span>
    }
  </button>

  @if (suppressedBlockerReasonCode(); as code) {
    <div class="panel-action__blocker" role="alert">
      <strong>{{ code | receiptLabel }}</strong>
    </div>
  }

  @if (blockerMoves().length > 0) {
    <div class="panel-action__moves">
      @for (move of blockerMoves(); track move.label + move.action.kind) {
        <button
          type="button"
          class="panel-action__move"
          [disabled]="pending()"
          [attr.aria-busy]="pending()"
          (click)="requestMove(move)"
        >
          {{ move.label }}
        </button>
      }
    </div>
  }
</div>

@if (confirmationOpen()) {
  @if (action().confirmation; as confirmation) {
    <app-typed-halt-confirm
      [open]="true"
        [heading]="confirmation.title"
        [message]="confirmation.body"
        [consequence]="confirmation.consequence"
        [requiredToken]="confirmation.required_token ?? ''"
        [confirmLabel]="confirmation.confirm_label"
        (confirmed)="confirm()"
        (cancelled)="confirmationOpen.set(false)"
    />
  }
}
