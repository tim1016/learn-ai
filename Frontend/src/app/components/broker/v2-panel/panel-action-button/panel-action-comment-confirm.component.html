<dialog
  #dialog
  class="panel-action-comment-confirm"
  aria-labelledby="panel-action-comment-confirm-heading"
  (cancel)="cancel($event)"
>
  <header>
    <h2 id="panel-action-comment-confirm-heading">{{ heading() }}</h2>
  </header>
  <p class="message">{{ message() }}</p>
  <p class="consequence">{{ consequence() }}</p>

  <section class="field">
    <label id="panel-action-comment-confirm-reason-label" for="panel-action-comment-confirm-reason">
      Why is this action necessary?
    </label>
    <p class="help" id="panel-action-comment-confirm-reason-help">
      Required. This becomes part of the audited Clerk journal record.
    </p>
    <textarea
      pTextarea
      id="panel-action-comment-confirm-reason"
      rows="4"
      aria-required="true"
      aria-describedby="panel-action-comment-confirm-reason-help"
      [attr.aria-invalid]="reason().trim().length === 0"
      [invalid]="reason().trim().length === 0"
      [value]="reason()"
      autofocus
      data-testid="panel-action-comment-confirm-reason"
      (input)="updateReason($event)"
    ></textarea>
    @if (reason().trim().length === 0) {
      <p class="blocking" role="status">Enter a reason to enable {{ confirmLabel() }}.</p>
    }
  </section>

  @if (requiredToken()) {
    <label class="field">
      <span class="label">Type <code>{{ requiredToken() }}</code> to confirm</span>
      <input
        type="text"
        autocomplete="off"
        spellcheck="false"
        [value]="token()"
        data-testid="panel-action-comment-confirm-token"
        (input)="updateToken($event)"
      />
    </label>
  }

  <footer>
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button
      type="button"
      class="btn-danger"
      data-testid="panel-action-comment-confirm-submit"
      [disabled]="!canConfirm()"
      (click)="confirm()"
    >
      {{ confirmLabel() }}
    </button>
  </footer>
</dialog>
