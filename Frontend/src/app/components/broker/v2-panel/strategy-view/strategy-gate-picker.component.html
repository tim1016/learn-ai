<button #trigger type="button" class="gate-chip" [attr.popovertarget]="popoverId" aria-haspopup="dialog">
  <span class="gate-chip__icon" aria-hidden="true">◐</span>
  Gate: {{ activeGate().label }}
  <small>{{ activeGate().source | receiptLabel }}</small>
  <span aria-hidden="true">▾</span>
</button>

<div #panel [id]="popoverId" class="gate-popover" popover role="dialog" [attr.aria-labelledby]="titleId" (toggle)="onToggle($event)">
  <h3 [id]="titleId">Dark Bright Gate</h3>
  <p class="gate-popover__note">
    Shades the strategy candles: bright where the gate holds, dark where it fails.
    One gate at a time. Gates only shade; they never trade.
  </p>
  <div class="gate-list" role="radiogroup" [attr.aria-labelledby]="titleId">
    @for (gate of orderedGates(); track gate.gate_id) {
      <label class="gate-option">
        <input
          type="radio"
          [name]="popoverId"
          [value]="gate.gate_id"
          [checked]="gate.gate_id === activeGate().gate_id"
          (change)="choose(gate.gate_id)"
        />
        <span class="gate-option__label">{{ gate.label }}</span>
        <span class="gate-option__source" [class.gate-option__source--strategy]="gate.source === 'strategy'">
          {{ gate.source | receiptLabel }}
        </span>
        <code class="gate-option__expression">{{ gate.expression }}</code>
      </label>
    }
  </div>
</div>
