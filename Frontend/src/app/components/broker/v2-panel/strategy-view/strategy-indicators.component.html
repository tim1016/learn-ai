<button #trigger type="button" class="indicators-chip" [attr.popovertarget]="popoverId" aria-haspopup="dialog">
  <span aria-hidden="true">+</span> Indicators
</button>

<div #panel [id]="popoverId" class="indicators-popover" popover role="dialog" [attr.aria-labelledby]="titleId" (toggle)="onToggle($event)">
  <h3 [id]="titleId">Indicators</h3>
  <h4 class="indicators-popover__section">Strategy’s own · bot’s values</h4>
  <ul class="indicators-list">
    @for (value of drawn(); track value.key) {
      <li>
        <span>
          {{ value.label }}
          @if (value.band; as band) { · {{ band[0] }}–{{ band[1] }} band }
        </span>
        <span class="indicators-list__tag">always on</span>
      </li>
    }
  </ul>
</div>
