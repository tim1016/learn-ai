<div
  #chartContainer
  class="strategy-chart"
  role="group"
  aria-roledescription="chart"
  tabindex="0"
  [attr.aria-label]="ariaLabel()"
  (keydown)="onKeydown($event)"
></div>
@if (lanes().length > 0) {
  <div class="strategy-lanes" role="group" aria-label="The run’s events on the chart’s clock">
    @for (lane of lanes(); track lane.key) {
      <div class="strategy-lanes__row" role="list" [attr.aria-label]="lane.title" [attr.data-lane]="lane.key">
        <span class="strategy-lanes__title" aria-hidden="true">{{ lane.title }}</span>
        @for (mark of lane.marks; track mark.key) {
          <span
            role="listitem"
            class="strategy-lanes__mark"
            [class.strategy-lanes__mark--off]="mark.left === null"
            [attr.data-glyph]="mark.glyph"
            [attr.data-tone]="mark.tone"
            [style.left.px]="mark.left"
            [style.width.px]="mark.width"
            [attr.aria-label]="mark.label"
            [title]="mark.label"
          ></span>
        }
      </div>
    }
  </div>
}
<p class="strategy-chart__announcement" aria-live="polite">{{ announcement() }}</p>
