<section class="run-fills" aria-labelledby="run-fills-title">
  <header class="run-fills-header">
    <h3 id="run-fills-title" class="run-fills-title">Fills this run</h3>
    @if (runStartedAtMs()) {
      <app-timestamp-display
        [value]="runStartedAtMs()"
        mode="date-et"
        class="trading-date"
        aria-label="Run date"
      />
    }
  </header>

  @if (hasFills()) {
    <app-fill-table [fills]="inlineFills()" label="Fills this run" />

    @if (hasMoreFills()) {
      <button type="button" class="view-all-fills" (click)="openAllFills()">
        View {{ shownWords() }}
      </button>
    }
  } @else {
    <p class="no-fills" role="status">No fills this run.</p>
  }
</section>

<p-drawer
  [visible]="allFillsOpen()"
  (visibleChange)="allFillsOpen.set($event)"
  position="right"
  [modal]="true"
  [dismissible]="true"
  [showCloseIcon]="false"
  styleClass="fills-drawer"
  [style]="{ width: 'min(38rem, 96vw)' }"
>
  <ng-template #header>
    <div class="fills-drawer__header">
      <h2>All fills this run</h2>
      <button type="button" aria-label="Close all fills" (click)="closeAllFills()">×</button>
    </div>
  </ng-template>

  @if (allFillsOpen()) {
    @if (fillCount() > fills().length) {
      <p class="fills-drawer__note">The newest {{ fills().length }} of this run's {{ fillCount() }} fills.</p>
    }
    <app-fill-table [fills]="fills()" label="All fills this run" />
  }
</p-drawer>
