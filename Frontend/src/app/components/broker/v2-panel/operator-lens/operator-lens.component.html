<!-- Operator lens (spec §7). Four regions. -->
<div class="operator-lens">

  <!-- ── Top bar: Flatten & stop ─────────────────────────────────────────── -->
  @if (flattenStopAction()) {
    @let fsa = flattenStopAction()!;
    <div class="operator-lens__top-bar">
      <app-panel-action-button
        [action]="fsa"
        [pending]="actionPending()"
        tone="danger"
        (triggered)="onActionRequested($event)"
      />
    </div>
  }

  <!-- ── Main layout: rail + cards ──────────────────────────────────────── -->
  <div class="operator-lens__main">

    <!-- Rail (center) -->
    <div class="operator-lens__rail-col">
      <app-transaction-rail
        [rail]="displayRail()"
        [profile]="profile()"
        (evidenceRequested)="onEvidenceRequested($event)"
      />
    </div>

    <!-- Side cards (beside the rail, not inside it — spec §7) -->
    <aside class="operator-lens__cards">
      <!-- Bot health card (§7.2) -->
      <app-health-card
        [health]="health()"
        [retireAction]="retireAction()"
        [actionPending]="actionPending()"
        (actionRequested)="onActionRequested($event)"
      />

      <!-- Account/clerk card (§7.3) -->
      <app-clerk-card
        [clerk]="clerk()"
        [reconcileAction]="reconcileAction()"
        [clearHoldAction]="clearHoldAction()"
        [actionPending]="actionPending()"
        (actionRequested)="onActionRequested($event)"
      />
    </aside>

  </div>

  <!-- ── Journal tail (bottom, internal scroll) ─────────────────────────── -->
  <div class="operator-lens__journal">
    @if (journalError()) {
      <p role="alert">{{ journalError() }}</p>
    }
    <app-journal-tail
      [evidencePage]="journalPage()"
      [loading]="journalLoading()"
      (transactionSelected)="onTransactionSelected($event)"
      (evidenceDrawerRequested)="onEvidenceRequested($event)"
    />
  </div>

</div>

<!-- ── Evidence drawer (portal-style overlay) ────────────────────────────── -->
<app-evidence-drawer
  [broker]="broker()"
  [accountId]="accountId()"
  [sid]="sid()"
  [transactionRef]="evidenceDrawerRef()"
  [open]="evidenceDrawerOpen()"
  (closed)="onEvidenceDrawerClose()"
/>
