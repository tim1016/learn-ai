<app-bot-detail-banner
  [updatedAtMs]="panel().updated_at_ms"
  [snapshotStatus]="'Revision ' + panel().revision + (panel().health.running ? ' running' : ' stopped')"
>
  <!-- Which bot this is, and the way back, sit above the Trader/Operator
       switch (ADR 0064 Decision 1) — they apply to both lenses, so neither
       lens repeats them. What stays here is this bot's own instance id. -->
  <div botBannerIdentity class="operator-bot-banner__identity">
    <code>{{ panel().strategy_instance_id }}</code>
  </div>

  <app-panel-instrument-quote
    botBannerQuote
    [symbol]="panel().symbol"
    [tickerQuote]="tickerQuote()"
  />

  <app-mission-verdict-status
    botBannerStatus
    [verdict]="panel().mission_verdict"
  />

  @if (primaryAction(); as action) {
    <app-panel-action-button
      botBannerAction
      [action]="action"
      [pending]="actionPending()"
      [tone]="primaryActionTone()"
      (triggered)="actionRequested.emit($event)"
    />
  }

  @if (promotedFlattenAction(); as flatten) {
    <app-panel-action-button
      botBannerAction
      [action]="flatten"
      [pending]="actionPending()"
      [tone]="promotedFlattenTone()"
      (triggered)="actionRequested.emit($event)"
    />
  }

  @if (overflowActions().length > 0) {
    <app-bot-banner-overflow botBannerOverflow label="More operator actions">
      @for (action of overflowActions(); track action.action_id) {
        <app-panel-action-button
          [action]="action"
          [pending]="actionPending()"
          tone="neutral"
          (triggered)="actionRequested.emit($event)"
        />
      }
    </app-bot-banner-overflow>
  }
</app-bot-detail-banner>
