<app-bot-detail-banner
  [backLink]="backLink()"
  [backLabel]="(panel().broker | receiptLabel) + ' bots'"
  [updatedAtMs]="panel().updated_at_ms"
>
  <div botBannerIdentity class="trader-bot-banner__identity">
    <span class="trader-bot-banner__strategy">{{ panel().strategy_label }}</span>
    <code>{{ panel().strategy_instance_id }}</code>
  </div>

  <span
    botBannerStatus
    class="trader-bot-banner__status"
    [attr.data-state]="panel().mission_verdict.state"
    [attr.aria-label]="panel().mission_verdict.label"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >{{ panel().mission_verdict.label }}</span>

  @if (primaryAction(); as action) {
    <app-panel-action-button
      botBannerAction
      [action]="action"
      [pending]="actionPending()"
      [tone]="primaryActionTone()"
      (triggered)="actionRequested.emit($event)"
    />
  }

  <div botBannerOverflow class="trader-bot-banner__overflow">
    <button
      type="button"
      aria-label="More trader actions"
      aria-haspopup="true"
      [attr.aria-expanded]="overflowOpen()"
      aria-controls="trader-banner-actions"
      (click)="toggleOverflow()"
    >⋯</button>
    @if (overflowOpen()) {
      <div id="trader-banner-actions" class="trader-bot-banner__menu">
      <a
        [routerLink]="manualOrderNavigation().commands"
        [queryParams]="manualOrderNavigation().queryParams"
      >Manual order</a>
      </div>
    }
  </div>
</app-bot-detail-banner>
