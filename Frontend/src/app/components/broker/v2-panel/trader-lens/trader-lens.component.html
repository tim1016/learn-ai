<div class="trader-workspace">
  <section class="chart-section" aria-label="Market and fill chart">
    <app-dual-pane-chart
      [symbol]="symbol()"
      [liveBars]="liveBars()"
      [liveFillMarkers]="liveFillMarkers()"
      [liveNotices]="liveNotices()"
      [liveLoading]="liveChartLoading()"
      [historyLoading]="histChartLoading()"
      [liveResolution]="liveResolution()"
      [histBars]="histBars()"
      [histFillMarkers]="histFillMarkers()"
      [selectedPreset]="selectedPreset()"
      (presetChange)="onPresetChange($event)"
      (liveResolutionChange)="liveResolutionChange.emit($event)"
    />
  </section>

  <aside class="trader-rail" aria-label="Trader summary and actions">
    <app-trader-metrics [panel]="panel()" />

    <section class="trader-command" aria-labelledby="trader-status-title">
      <div>
        <span class="eyebrow">Bot status</span>
        <h2 id="trader-status-title">{{ headline() }}</h2>
        <p>{{ panel().execution_policy }}</p>
        @if (isDryRun()) { <strong>Dry Run · no broker orders</strong> }
      </div>
      <div class="trader-command__actions">
        <a
          class="trader-command__manual-link"
          routerLink="/brokers/alpaca"
          title="Open the account-scoped order ticket; every order intent is recorded before Alpaca is called."
        >Manual order</a>
        @if (primaryAction(); as action) {
          <app-panel-action-button
            [action]="action"
            [pending]="actionPending()"
            [tone]="action.action_id === 'stop' ? 'danger' : 'primary'"
            (triggered)="actionRequested.emit($event)"
          />
        }
      </div>
    </section>
  </aside>
</div>

@if (isPaperExecution()) {
  <app-trades-today-list
    [fills]="liveFillMarkers()"
    [feeFidelity]="profile().fee_fidelity"
    [tradingDateMs]="tradingDateMs()"
  />
} @else if (isLogOnly()) {
  <section class="observation-note" role="status">
    <strong>Observation only</strong>
    <span>This bot records decisions but does not place broker orders.</span>
  </section>
}
