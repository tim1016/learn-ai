<div class="trader-workspace">
  <section class="chart-section" aria-label="Market and fill chart">
    <app-dual-pane-chart
      [symbol]="symbol()"
      [tickerQuote]="tickerQuote()"
      [liveBars]="liveBars()"
      [liveFillMarkers]="liveFillMarkers()"
      [liveNotices]="liveNotices()"
      [liveLoading]="liveChartLoading()"
      [historyLoading]="histChartLoading()"
      [historyFailed]="histChartFailed()"
      [liveResolution]="liveResolution()"
      [histBars]="histBars()"
      [histIndicatorBars]="histIndicatorBars()"
      [histIndicatorBarBudget]="histIndicatorBarBudget()"
      [histIndicatorBarBudgetSatisfied]="histIndicatorBarBudgetSatisfied()"
      [histFillMarkers]="histFillMarkers()"
      [historyDataTimeframe]="histChart()?.timeframe ?? null"
      [historyTimeframe]="historyTimeframe()"
      (historyTimeframeChange)="onHistoryTimeframeChange($event)"
      (liveResolutionChange)="liveResolutionChange.emit($event)"
      (historyRetry)="histChartRetry.emit()"
    />
  </section>

  <aside class="trader-rail" aria-label="Trader summary">
    <app-trader-metrics [panel]="panel()" />

    @if (isBrokerExecution()) {
      <app-trades-today-list
        [fills]="liveFillMarkers()"
        [fillCount]="panel().fills_today"
        [feeFidelity]="profile().fee_fidelity"
        [tradingDateMs]="tradingDateMs()"
      />
    } @else if (isDryRun()) {
      <app-recent-decisions-list [decisions]="recentDecisions()" />
    } @else if (isLogOnly()) {
      <section class="observation-note" role="status">
        <strong>Observation only</strong>
        <span>This bot records decisions but does not place broker orders.</span>
      </section>
    }
  </aside>
</div>
