<section class="trades-today" aria-labelledby="fills-today-title">
  <header class="trades-header">
    <div>
      <span class="trades-kicker">Execution</span>
      <h3 id="fills-today-title" class="trades-title">Fills today</h3>
    </div>
    @if (tradingDateMs()) {
      <app-timestamp-display
        [value]="tradingDateMs()"
        mode="date-et"
        class="trading-date"
        aria-label="Trading date"
      />
    }
    @if (feesLabel()) {
      <span class="fees-note">{{ feesLabel() }}</span>
    }
  </header>

  @if (hasFills()) {
    <app-fill-table [fills]="inlineFills()" label="Fills today" />

    @if (hasMoreFills()) {
      <button type="button" class="view-all-fills" (click)="openAllFills()">
        View all {{ fills().length }} fills
      </button>
    }

  } @else {
    <p class="no-trades" role="status">{{ emptyStateLabel() }}</p>
  }
</section>

<p-drawer
  [visible]="allFillsOpen()"
  (visibleChange)="allFillsOpen.set($event)"
  position="right"
  [modal]="true"
  [dismissible]="true"
  [showCloseIcon]="false"
  styleClass="fills-drawer"
  [style]="{ width: 'min(38rem, 96vw)' }"
>
  <ng-template #header>
    <div class="fills-drawer__header">
      <div>
        <span>Execution</span>
        <h2>All fills today</h2>
      </div>
      <button type="button" aria-label="Close all fills" (click)="closeAllFills()">×</button>
    </div>
  </ng-template>

  @if (allFillsOpen()) {
    <app-fill-table [fills]="fills()" label="All fills today" />
  }
</p-drawer>
