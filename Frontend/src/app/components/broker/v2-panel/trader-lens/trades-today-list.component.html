<section class="trades-today" aria-labelledby="fills-today-title">
  <header class="trades-header">
    <div>
      <span class="trades-kicker">Execution</span>
      <h3 id="fills-today-title" class="trades-title">Fills today</h3>
    </div>
    @if (tradingDateMs()) {
      <app-timestamp-display
        [value]="tradingDateMs()"
        mode="date-et"
        class="trading-date"
        aria-label="Trading date"
      />
    }
    @if (feesLabel()) {
      <span class="fees-note">{{ feesLabel() }}</span>
    }
  </header>

  @if (hasFills()) {
    <table class="fills-table" aria-label="Fills today">
      <thead>
        <tr>
          <th scope="col">Time</th>
          <th scope="col">Side</th>
          <th scope="col">Qty</th>
          <th scope="col">Price</th>
        </tr>
      </thead>
      <tbody>
        @for (fill of fills(); track fill.order_ref) {
          <tr
            class="fill-row"
            [class.fill-row--buy]="fill.side === 'buy'"
            [class.fill-row--sell]="fill.side === 'sell'"
          >
            <td>
              <app-timestamp-display
                [value]="fill.filled_at_ms"
                mode="local"
                granularity="time"
              />
            </td>
            <td class="fill-side">{{ fill.side | receiptLabel }}</td>
            <td>{{ fill.quantity }}</td>
            <td>{{ fmtCurrency(fill.price) }}</td>
          </tr>
        }
      </tbody>
    </table>

  } @else {
    <p class="no-trades" role="status">No fills today.</p>
  }
</section>
