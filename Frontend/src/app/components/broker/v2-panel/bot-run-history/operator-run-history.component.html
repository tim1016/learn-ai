<app-operator-disclosure-card
  title="Runs"
  hint="Current run; earlier runs are in History"
  (expandedChange)="expanded.set($event)"
>
  @if (expanded()) {
    <app-bot-current-run
      [state]="currentRunState()"
      [botRunning]="botRunning()"
      [feedContinuity]="feedContinuity()"
      [historyLink]="historyLink()"
      (retryRequested)="runRefreshRequested.emit()"
    />
  }
</app-operator-disclosure-card>
