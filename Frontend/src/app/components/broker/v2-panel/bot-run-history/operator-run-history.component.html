<app-operator-disclosure-card
  title="Runs"
  hint="Current and previous runs"
  (expandedChange)="onExpandedChange($event)"
>
  @if (expanded()) {
    <app-bot-run-history
      [state]="state()"
      [botRunning]="botRunning()"
      [feedContinuity]="feedContinuity()"
      (navigationRequested)="navigate($event)"
    />
  }
</app-operator-disclosure-card>
