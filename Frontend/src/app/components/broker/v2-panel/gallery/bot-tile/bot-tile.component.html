<article class="bot-tile" [class.bot-tile--attention]="bot().needs_attention">
  <header class="bot-tile__header">
    <span
      class="bot-tile__ring"
      [class.bot-tile__ring--bull]="statusTone() === 'bull'"
      [class.bot-tile__ring--warn]="statusTone() === 'warn'"
      [class.bot-tile__ring--muted]="statusTone() === 'muted'"
    >
      <app-asset-identity [symbol]="bot().symbol" size="sm" />
    </span>
    <span class="bot-tile__strategy">{{ bot().label }}</span>

    <div class="bot-tile__action">
      <button
        #actionButton
        type="button"
        class="bot-tile__action-button"
        [class.bot-tile__action-button--stop]="actionIsStop()"
        [disabled]="pending() || !bot().primary_action.enabled"
        [attr.aria-busy]="pending()"
        [attr.title]="actionTitle()"
        [attr.aria-label]="actionAriaLabel()"
        (click)="onActionClick()"
      >
        <i
          class="pi"
          [class.pi-stop]="actionIsStop() && !pending()"
          [class.pi-play]="!actionIsStop() && !pending()"
          [class.pi-spin]="pending()"
          [class.pi-spinner]="pending()"
          aria-hidden="true"
        ></i>
        @if (actionIsStop()) {
          <span>{{ bot().primary_action.label }}</span>
        }
      </button>

      @if (confirmOpen()) {
        <div
          class="bot-tile__confirm"
          role="alertdialog"
          aria-label="Confirm quick action"
          aria-describedby="bot-tile-confirm-{{ bot().sid }}"
        >
          <p id="bot-tile-confirm-{{ bot().sid }}">{{ confirmText() }}</p>
          <button type="button" (click)="confirmAction()">Confirm</button>
          <button #confirmCancelButton type="button" (click)="cancelAction()">Cancel</button>
        </div>
      }
    </div>
  </header>

  <div
    #chartContainer
    class="bot-tile__chart"
    role="button"
    tabindex="0"
    [attr.aria-label]="chartAriaLabel()"
    (click)="onBodyClick()"
    (keydown.enter)="onBodyClick()"
    (keydown.space)="onBodySpaceKey($event)"
    (mousemove)="onChartHover($event)"
    (mouseleave)="onChartLeave()"
  >
    <canvas #chartCanvas class="bot-tile__canvas"></canvas>

    <div class="bot-tile__legend" aria-hidden="true">
      @if (hoverLegend(); as legend) {
        <span class="bot-tile__legend-text">{{ legend }}</span>
      } @else {
        <span
          class="bot-tile__legend-item"
          [class.bot-tile__legend-item--positive]="deltaTone() === 'positive'"
          [class.bot-tile__legend-item--negative]="deltaTone() === 'negative'"
        >{{ formattedDeltaPct() ?? '—' }}</span>
        <span class="bot-tile__legend-sep">·</span>
        <span class="bot-tile__legend-item">{{ formattedFills() }}</span>
        <span class="bot-tile__legend-sep">·</span>
        <span
          class="bot-tile__legend-item"
          [class.bot-tile__legend-item--positive]="pnlTone() === 'positive'"
          [class.bot-tile__legend-item--negative]="pnlTone() === 'negative'"
        >{{ formattedPnl() }}</span>
      }
    </div>
  </div>
</article>
