<fieldset class="order-terms" aria-labelledby="deploy-option-order-terms-title">
  <legend><span id="deploy-option-order-terms-title">Option order terms · fixed for this bot’s life</span></legend>
  @if (read(); as held) {
    <app-deploy-option-order-term-fields [terms]="held.terms" [defaults]="held.defaults" (termsChange)="termsChange.emit($event)" />
  } @else if (failure(); as why) {
    <!-- The What step says this as an alert, beside its retry. Here it stands where the boxes would. -->
    <p>{{ why }}</p>
  } @else {
    <p role="status">Reading the option order terms…</p>
  }
</fieldset>
