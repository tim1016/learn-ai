<section class="binding-strip" aria-labelledby="deploy-binding-title">
  <h2 id="deploy-binding-title">Bot binding</h2>

  <div class="binding-strip__fields">
    <label class="binding-field">
      <span>Bot name</span>
      <input
        type="text"
        [value]="instanceId()"
        placeholder="alpaca-spy-01"
        autocomplete="off"
        spellcheck="false"
        [attr.aria-invalid]="instanceIdError() !== null"
        (input)="changeInstanceId($event)"
        (blur)="instanceIdBlur.emit()"
      />
      @if (instanceIdError(); as error) { <em role="alert">{{ error }}</em> }
    </label>

    <div class="binding-field binding-field--strategy">
      @if (strategies().length === 1) {
        <span>Validated strategy</span>
        <strong>{{ selectedStrategy()?.label }}</strong>
      } @else {
        <label for="deploy-strategy">Validated strategy</label>
        <select id="deploy-strategy" (change)="changeStrategy($event)">
          @for (strategy of strategies(); track strategy.strategy_key) {
            <option
              [value]="strategy.strategy_key"
              [selected]="strategy.strategy_key === strategyKey()"
            >{{ strategy.label }}</option>
          }
        </select>
      }
      <div class="binding-field__trust">
        <span>✓ Validated</span>
        @if (selectedStrategy(); as selected) {
          <div class="binding-field__actions">
            <button
              type="button"
              class="info-tip"
              [pTooltip]="selected.explanation"
              tooltipPosition="top"
              [attr.aria-label]="'About ' + selected.label + ': ' + selected.explanation"
            >i</button>
            <a routerLink="/strategy-validation" [queryParams]="{ strategy: selected.strategy_key }">
              View validation
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</section>
