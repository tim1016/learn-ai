<section class="launch-card" aria-labelledby="launch-replay-title">
  <div class="section-heading">
    <div>
      <p class="eyebrow">New session</p>
      <h2 id="launch-replay-title">Replay a completed NYSE day</h2>
    </div>
    <span class="strategy-label mono">EMA crossover signal</span>
  </div>

  <div class="launch-grid">
    <label>
      <span>Trading day</span>
      <select
        [value]="selectedSessionDateMs() ?? ''"
        [disabled]="loading() || active()"
        (change)="onDate($event)"
      >
        @for (option of dateOptions(); track option.session.session_date_ms) {
          <option [value]="option.session.session_date_ms">
            {{ option.label }} · {{ cachedLabel(option.session) }}
          </option>
        }
      </select>
    </label>

    <label>
      <span>Visible playback</span>
      <select [value]="playbackMinutes()" [disabled]="active()" (change)="onDuration($event)">
        <option [value]="30">30 minutes</option>
        <option [value]="60">60 minutes</option>
      </select>
    </label>

    <label>
      <span>Playback speed</span>
      <select [value]="speed()" [disabled]="active()" (change)="onSpeed($event)">
        <option [value]="1">1× · one bar per minute</option>
        <option [value]="10">10× · one bar per 6 seconds</option>
        <option [value]="60">60× · one bar per second</option>
      </select>
    </label>

    <button
      type="button"
      class="primary-action"
      [disabled]="launchDisabled()"
      (click)="launch.emit()"
    >
      <i class="pi pi-play" aria-hidden="true"></i>
      Launch SPY + TSLA
    </button>
  </div>

  <div class="launch-contract">
    <span><strong>SPY bot</strong> → SPY only</span>
    <span><strong>TSLA bot</strong> → TSLA only</span>
    <span><strong>$100,000</strong> simulated cash each</span>
    <span><strong>225 min</strong> indicator initialization</span>
  </div>
</section>
