@let item = variant();
<article class="metric-entry" [id]="item.variant_id" [attr.aria-labelledby]="item.variant_id + '-metric-entry-title'">
  <header class="metric-entry__header">
    <div>
      <p class="metric-entry__eyebrow">{{ item.metric_id }}</p>
      <h2 [id]="item.variant_id + '-metric-entry-title'">{{ item.label }}</h2>
    </div>
    <span class="metric-entry__producer">{{ item.producer | receiptLabel }}</span>
  </header>

  <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" class="metric-entry__tabs">
    <p-tablist aria-label="Metric guide views">
      <p-tab value="explain">Explain</p-tab>
      <p-tab value="calculation">Math &amp; contract</p-tab>
      <p-tab value="developer">Developer reference</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="explain">
        <app-metric-trader-explanation [variant]="item" />
      </p-tabpanel>
      <p-tabpanel value="calculation">
        <app-metric-calculation-contract [variant]="item" />
      </p-tabpanel>
      <p-tabpanel value="developer">
        <app-metric-developer-reference [variant]="item" />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

  <footer class="metric-entry__actions">
    @if (alternative(); as other) {
      <a class="metric-entry__compare" routerLink="/strategy-lab/docs" [queryParams]="compareQuery()">
        Compare with… {{ other.producer | receiptLabel }}
      </a>
    }
    @if (runId(); as id) {
      <a class="metric-entry__back" [routerLink]="['/strategy-lab/runs', id]">Back to run</a>
    }
  </footer>
</article>
