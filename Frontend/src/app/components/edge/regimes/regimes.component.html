<section class="route">
  <app-sample-data-banner [provenance]="data.provenance" />

  <header class="route-toolbar">
    <div class="toolbar-spacer"></div>
    <button class="score-pill" type="button" (click)="scoreOpen.set(true)">
      <span class="score-dot" [style.background]="currentScoreColor()"></span>
      <span>edge_score</span>
      <span class="score-val" [style.color]="currentScoreColor()">{{ currentScoreLabel() }}</span>
    </button>
    <span class="tz">America/New_York</span>
  </header>

  <!-- Form -->
  <div class="form-card">
    <div>
      <div class="eyebrow mb4">STATES</div>
      <div class="form-row">
        <span class="states-fixed">3 states</span>
      </div>
    </div>

    <span class="divider"></span>

    <div>
      <div class="eyebrow mb4">DECODING</div>
      <div class="seg">
        @for (v of ['viterbi','posterior']; track v) {
          <button type="button" class="seg-btn view"
                  [class.on]="viewMode() === v"
                  (click)="setView($any(v))">{{ v }}</button>
        }
      </div>
    </div>

    <div class="form-spacer"></div>

    <div class="legend-row">
      @for (n of regimeNames; track n; let i = $index) {
        <div class="legend-item">
          <span class="legend-dot" [style.background]="regimeColors[i]"></span>
          <span>{{ n }}</span>
        </div>
      }
    </div>
  </div>

  <!-- Price chart -->
  <div class="chart-card">
    <app-edge-regime-price-chart
      [width]="1340" [height]="260"
      [data]="data" [viewMode]="viewMode()"
      [hoverIdx]="hoverIdx()"
      (hover)="hoverIdx.set($event)" />
  </div>

  <!-- Bottom row -->
  <div class="bottom-grid">
    <div class="bottom-card matrix-card">
      <app-edge-transition-matrix [size]="236" [matrix]="data.transitionMatrix" />
    </div>

    <div class="bottom-card">
      <div class="eyebrow mb4">CENTROID FEATURE RADAR</div>
      <app-edge-regime-radar [size]="260" [axes]="radarAxes" [regimeData]="data.regimeCentroids" />
    </div>

    <div class="bottom-card">
      <app-edge-stability-sparkline [width]="420" [height]="130" [data]="data.stability" />
      <div class="strategy-fit">
        <div class="eyebrow mb6">STRATEGY-FIT P&amp;L · BY REGIME</div>
        <div class="fit-list">
          @for (r of data.perRegime; track r.id) {
            <div class="fit-row">
              <span class="fit-dot" [style.background]="regimeColors[r.id]"></span>
              <span class="fit-name">{{ r.name }}</span>
              <span class="fit-sharpe" [style.color]="sharpeColor(r.sharpe)">
                {{ fmtSharpe(r.sharpe) }} sh
              </span>
              <div class="fit-bar">
                <span class="fit-bar-fill"
                      [style.left]="sharpeBarLeft(r.pnl)"
                      [style.width]="sharpeBarWidth(r.pnl)"
                      [style.background]="r.pnl > 0 ? TOK.bull : TOK.bear"></span>
                <span class="fit-bar-zero"></span>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Drawers -->
  <app-edge-score-drawer
    [data]="data" [open]="scoreOpen()"
    (closed)="scoreOpen.set(false)" />
  <app-trade-sim-drawer
    [data]="data" [open]="tradeSimOpen()"
    (closed)="tradeSimOpen.set(false)" />
</section>
