<app-study-page
  study="realized-vs-iv"
  [readySummary]="readySummary()"
  [canRun]="!loading()"
  [running]="loading()"
  [hasOutput]="hasOutput()"
  [hasResult]="data() !== null"
  [previous]="inputs.isPrevious()"
  [captured]="inputs.captured()"
  (run)="onCompute()"
>
  <app-symbol-picker
    studyInstrument
    [symbol]="symbol()"
    (symbolChange)="symbol.set($event)"
  />

  <div studyConfig class="form-card">
    <label class="field">
      <span class="field-label">Bar size</span>
      <select class="field-input mono"
              [value]="barSize()"
              (change)="barSize.set($any($event.target).value)">
        @for (b of ['5m','15m','1h','1D']; track b) {
          <option [value]="b" [selected]="b === barSize()">{{ b }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="field-label">Tenor</span>
      <select class="field-input mono"
              [value]="tenor()"
              (change)="tenor.set($any($event.target).value)">
        @for (t of ['7D','14D','30D','60D']; track t) {
          <option [value]="t" [selected]="t === tenor()">{{ t }}</option>
        }
      </select>
    </label>

    <div class="estimator-block">
      <span class="field-label" title="HF estimator session for VRP-driving rv_hf_21d. The trailing Yang-Zhang lines are session-agnostic daily-bar.">
        HF session
      </span>
      <div class="chip-row">
        @for (s of ['ETH','RTH']; track s) {
          <button type="button" class="vol-chip"
                  [class.on]="sessionOn($any(s))"
                  (click)="setSession($any(s))">
            {{ s }}
          </button>
        }
      </div>
    </div>
  </div>

  <div studyProgress>
    @if (errorMsg()) {
      <div class="compute-error" data-testid="rviv-error">
        <i class="pi pi-times-circle"></i>
        Compute failed — {{ errorMsg() }}
      </div>
    }
  </div>

  <div studyResult>
    @if (data(); as d) {
      <app-realized-vs-iv-report [data]="d" [barSize]="barSize()" />
    }
  </div>
</app-study-page>
