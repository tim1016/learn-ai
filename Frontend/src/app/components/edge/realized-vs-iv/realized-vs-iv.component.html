<app-study-page
  study="realized-vs-iv"
  [readySummary]="readySummary()"
  [canRun]="!loading()"
  [running]="loading()"
  [hasOutput]="hasOutput()"
  [hasResult]="data() !== null"
  [previous]="inputs.isPrevious()"
  [captured]="inputs.captured()"
  [prefill]="prefillNotice()"
  [dataSource]="sourceLine()"
  dataSourceWindows="date-et"
  (run)="onCompute()"
>
  <app-symbol-picker
    studyInstrument
    [symbol]="symbol()"
    (symbolChange)="symbol.set($event)"
  />

  <div studyConfig class="form-card">
    <label class="field">
      <span class="field-label">Bar size</span>
      <select class="field-input mono" data-testid="rviv-bar-size" (change)="selectBarSize($event)">
        @for (b of barSizes; track b) {
          <option [value]="b" [selected]="b === barSize()">{{ b }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="field-label">Tenor</span>
      <select class="field-input mono" data-testid="rviv-tenor" (change)="selectTenor($event)">
        @for (t of tenors; track t) {
          <option [value]="t" [selected]="t === tenor()">{{ t }}</option>
        }
      </select>
    </label>

    @if (barSize() === '15m') {
      <div class="estimator-block" data-testid="rviv-hf-session">
        <span class="field-label" title="HF estimator session for VRP-driving rv_hf_21d. The trailing Yang-Zhang lines use every 15-minute bar.">
          HF session
        </span>
        <div class="chip-row">
          @for (s of hfSessions; track s) {
            <button type="button" class="vol-chip"
                    [class.on]="sessionOn(s)"
                    (click)="setSession(s)">
              {{ s }}
            </button>
          }
        </div>
      </div>
    }
  </div>

  <div studyProgress>
    @if (loading() && status(); as message) {
      <span class="run-status" data-testid="rviv-status">{{ message }}</span>
    }
    @if (errorMsg()) {
      <div class="compute-error" data-testid="rviv-error">
        <i class="pi pi-times-circle"></i>
        Compute failed — {{ errorMsg() }}
      </div>
    }
    @if (refused(); as r) {
      <div class="lake-refused" data-testid="rviv-refused">
        <app-lake-study-source [refusal]="r.refusal" />
      </div>
    }
  </div>

  <div studyResult>
    @if (data(); as d) {
      <app-realized-vs-iv-report [data]="d" />
    }
  </div>
</app-study-page>
