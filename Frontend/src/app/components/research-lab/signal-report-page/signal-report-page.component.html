<div class="p-4">
  <a class="back-link" routerLink="/research/history" [queryParams]="{ type: 'signal-report' }">Back to History</a>
  @if (loading()) {
    <div class="flex justify-center items-center py-16">
      <p-progress-spinner strokeWidth="3" />
    </div>
  } @else if (error(); as err) {
    <p-message severity="error">{{ err }}</p-message>
  } @else if (result(); as res) {
    <app-signal-report [result]="res" />
  }
</div>
