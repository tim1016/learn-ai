<div class="research-lab">
  <app-page-header
    [title]="title()"
    [hasTabs]="true"
  />

  <nav class="rl-subnav" aria-label="Research Lab pages">
    <div class="rl-children-row">
      @for (item of items; track item.path) {
        <a
          class="rl-tab"
          [routerLink]="item.path"
          routerLinkActive="active"
        >
          {{ item.label }}
        </a>
      }
    </div>
  </nav>

  <div class="rl-panel">
    <router-outlet />
  </div>
</div>
