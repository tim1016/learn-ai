<app-study-page
  study="cross-sectional"
  [readySummary]="readySummary()"
  [canRun]="canRun()"
  [running]="starting() || loading()"
  [blockedReason]="blockedReason()"
  [hasOutput]="hasOutput()"
  [hasResult]="result() !== null"
  [previous]="inputs.isPrevious()"
  [captured]="inputs.captured()"
  (run)="runBatch()"
>
  <!-- The universe, its window and nothing else: the picker's own sampling
       card is hidden because bars are daily by construction (#3527). -->
  <app-multi-ticker-range-picker
    studyInstrument
    [(value)]="range"
    [hideSampling]="true"
    [showAutoFetch]="false"
    title="Cross-sectional data"
  />

  <div studyConfig class="study-config">
    <div class="config-field">
      <span class="block mb-1 font-semibold text-sm">Options Feature</span>
      <p-select
        [options]="features"
        [(ngModel)]="featureName"
        optionLabel="label"
        optionValue="value"
        class="w-full"
      />
    </div>
    <div class="config-field">
      <span class="block mb-1 font-semibold text-sm">Target Type</span>
      <p-select
        [options]="targetTypes"
        [(ngModel)]="targetType"
        optionLabel="label"
        optionValue="value"
        class="w-full"
      />
    </div>
  </div>

  <div studyProgress>
    <!-- Shared live-progress panel — also used by feature-runner and signal-engine. -->
    @if (job(); as j) {
      <app-run-progress-panel
        class="block mb-4"
        [job]="j"
        [logs]="logEntries()"
        title="Cross-sectional run"
        (cancelRun)="onPanelCancel()"
      />
    }

    @if (error(); as err) {
      <p-message severity="error" class="mb-4">{{ err }}</p-message>
    }
  </div>

  <!-- Final aggregate result -->
  <div studyResult>
    @if (result(); as res) {
      <app-cross-sectional-report [result]="res" />
    }

  </div>
</app-study-page>
