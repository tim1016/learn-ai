<section class="card" aria-labelledby="ob-duration-title">
  <div class="card__head"><h2 id="ob-duration-title">Duration</h2></div>
  <app-date-range-picker label="Backtest dates" [from]="range().from" [to]="range().to" [bounds]="bounds()" [ranges]="quickRanges" (changed)="changed.emit($event)" />
  <p id="ob-prices-from" class="words">
    @if (optionPricesFromMs(); as from) {
      Option prices are available from <app-timestamp-display [value]="from" mode="date-et" granularity="date" />
    } @else {
      From when option prices are available is shown once Check data has run.
    }
  </p>
  @if (rangeChange(); as change) {
    <p class="words" role="status">Range changed to <app-timestamp-display [value]="change.firstSessionOpenMs" mode="date-et" granularity="date" /> – <app-timestamp-display [value]="change.lastSessionOpenMs" mode="date-et" granularity="date" /></p>
  }
  @if (problem(); as message) { <p class="problem" role="alert">{{ message }}</p> }
</section>
