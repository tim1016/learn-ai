<div class="spacer" [style.height.px]="reserved()" aria-hidden="true"></div>
<section #panel class="footer" aria-label="Save this setup">
  <div class="bar">
    <div class="name">
      <label for="ob-setup-name">Setup name</label>
      <input id="ob-setup-name" pInputText type="text" autocomplete="off" [formField]="nameField()" [attr.aria-invalid]="nameProblem() !== null" aria-describedby="ob-save-status" (keydown.enter)="submit()" />
    </div>
    <button pButton type="button" [disabled]="!canSave()" (click)="submit()"><i class="pi pi-save" aria-hidden="true"></i><span>Save setup</span></button>
    <p id="ob-save-status" class="status" aria-live="polite">
      @if (nameProblem(); as message) {
        <span class="bad" role="alert">{{ message }}</span>
      } @else if (saving()) {
        <span role="status">Saving…</span>
      } @else if (status(); as saved) {
        <span [class.ok]="saved.kind === 'saved'" [class.bad]="saved.kind === 'refused'" [attr.role]="saved.kind === 'refused' ? 'alert' : 'status'">{{ saved.text }}</span>
      } @else if (hint(); as why) {
        <span>{{ why }}</span>
      }
    </p>
  </div>
</section>
