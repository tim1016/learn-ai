<section #panel class="footer" aria-label="Setup actions">
  <div class="bar">
    <div class="name">
      <label for="ob-setup-name">Setup name</label>
      <input id="ob-setup-name" pInputText type="text" autocomplete="off" [formField]="nameField()" [attr.aria-invalid]="nameProblem() !== null" aria-describedby="ob-save-status" (keydown.enter)="submit()" />
    </div>
    <button pButton type="button" severity="secondary" [disabled]="!canSave()" (click)="submit()"><i class="pi pi-save" aria-hidden="true"></i><span>Save setup</span></button>
    <div class="actions">
      <button pButton type="button" severity="secondary" [outlined]="true" [disabled]="!canCheck()" [attr.aria-describedby]="!canCheck() && runHint() !== null ? 'ob-run-hint' : null" (click)="check.emit()"><i class="pi pi-search" aria-hidden="true"></i><span>Check data</span></button>
      <button pButton type="button" class="start" [disabled]="!canStart()" aria-keyshortcuts="Shift+Enter" [attr.aria-describedby]="!canStart() && runHint() !== null ? 'ob-run-hint' : null" (click)="start.emit()"><i class="pi pi-play" aria-hidden="true"></i><span>Start backtest</span><kbd aria-hidden="true">Shift+Enter</kbd></button>
    </div>
    <p id="ob-save-status" class="status" aria-live="polite">
      @if (nameProblem(); as message) {
        <span class="bad" role="alert" [attr.title]="message">{{ message }}</span>
      } @else if (saving()) {
        <span role="status">Saving…</span>
      } @else if (status(); as saved) {
        <span [class.ok]="saved.kind === 'saved'" [class.bad]="saved.kind === 'refused'" [attr.role]="saved.kind === 'refused' ? 'alert' : 'status'" [attr.title]="saved.text">{{ saved.text }}</span>
      } @else if (hint(); as why) {
        <span [attr.title]="why">{{ why }}</span>
      }
      @if (runHint(); as why) { <span id="ob-run-hint" class="run-hint" [attr.title]="why">{{ why }}</span> }
    </p>
  </div>
</section>
