<div class="chain">
  <app-options-backtest-past-chain-controls
    [form]="controls" [session]="session()" [strikesShown]="strikesShown()"
    [underlyingProblem]="underlyingProblem()" [dateProblem]="dateProblem()" [timeProblem]="timeProblem()" [strikesProblem]="strikesProblem()" />
  <app-options-backtest-past-chain-download [plan]="plan()" [state]="downloadState()" [notOver]="notOver()" (start)="startDownload()" />
  <app-options-backtest-past-chain-expiries [view]="dayView()" [picked]="expiryMs()" (pick)="pickExpiry($event)" (retry)="retryDay()" />
  <app-options-backtest-past-chain-table [view]="chainView()" [expiryMs]="expiryMs()" [downloadOffered]="downloadOffered()" (retry)="retryChain()" />
</div>
