<div class="failure" role="alert">
  <p class="reason">{{ failure().reason }}</p>
  <p class="code">{{ failure().code | receiptLabel }}</p>
  @if (failure().items.length > 0) {
    <ul class="items" aria-label="What failed">
      @for (item of failure().items; track $index) {
        @let session = item.session_open_ms ?? null;
        <li>
          @if (session !== null) { <app-timestamp-display [value]="session" mode="date-et" granularity="date" /> } @else { <span>The run as a whole</span> }
          – {{ item.message }}
        </li>
      }
    </ul>
  }
</div>
