<fieldset class="pills" [disabled]="disabled()" [attr.aria-describedby]="describedBy()">
  <legend class="sr-only">{{ label() }}</legend>
  @for (option of options(); track option.value) {
    <label class="pill" [class.pill--chosen]="option.value === value()" [class.pill--unavailable]="isUnavailable(option.value)">
      <input type="radio" [name]="group" [value]="option.value" [checked]="option.value === value()" [disabled]="isUnavailable(option.value)" (change)="value.set(option.value)" (blur)="touch.emit()" />
      <span>{{ option.label }}</span>
    </label>
  }
</fieldset>
