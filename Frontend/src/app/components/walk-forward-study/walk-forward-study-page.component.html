<app-page-header title="Walk-Forward" icon="pi-forward" eyebrow="Strategy Tools" />
<main class="walk-forward">
  <p-tabs [value]="activeTab()" (valueChange)="setTab($event)">
    <p-tablist>
      <p-tab value="new"><i class="pi pi-sliders-h" aria-hidden="true"></i> New Study</p-tab>
      <p-tab value="history"><i class="pi pi-history" aria-hidden="true"></i> History</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="new">
        @if (prefillMessage(); as message) { <p class="notice" role="status">{{ message }}</p> }
        @if (strategiesError(); as error) {
          <p class="notice notice--error" role="alert">{{ error }}</p>
        } @else {
          <app-walk-forward-study-form [strategies]="strategies()" [prefill]="prefill()" (launched)="onLaunched($event)" />
        }
      </p-tabpanel>
      <p-tabpanel value="history">
        @if (lookupMessage(); as message) { <p class="notice" role="status">{{ message }}</p> }
        @if (openStudyId(); as id) {
          <app-walk-forward-study-result [studyId]="id" [strategies]="strategies()" (closed)="closeStudy()" (deleted)="closeStudy()" />
        } @else {
          <app-walk-forward-study-history [strategies]="strategies()" (opened)="openStudy($event)" />
        }
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</main>
