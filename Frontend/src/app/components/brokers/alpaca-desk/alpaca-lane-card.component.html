<li class="lane-card-item">
  <a
    class="lane-card"
    [class.lane-card--degraded]="!serving()"
    [routerLink]="openRoute()"
    [queryParams]="openQuery()"
    [queryParamsHandling]="openQueryHandling()"
  >
    <span class="lane-card__head">
      <span class="lane-card__label">{{ displayName().name }}</span>
      @if (displayName().disambiguator; as disambiguator) {
        <span class="lane-card__disambiguator">({{ disambiguator }})</span>
      }
    </span>
    <app-alpaca-lane-mode-chip [chip]="modeChip()" />
    @if (serving()) {
      <span class="lane-card__facts">
        <span class="lane-card__equity">{{ equityLine() }}</span>
        <span class="lane-card__bots">{{ botsLine() }}</span>
      </span>
    } @else if (lifecycleState() !== null) {
      <span class="lane-card__readiness">
        This lane is {{ lifecycleState() | receiptLabel }}.
      </span>
    } @else {
      <span class="lane-card__readiness">{{ readinessLine() }}</span>
    }
  </a>
</li>
