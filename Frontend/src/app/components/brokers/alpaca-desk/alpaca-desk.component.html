<main class="alpaca-desk">
  @if (contextTarget(); as target) {
  <app-alpaca-desk-account-state
    [state]="deskState()"
    [accountAvailable]="operatingDeskVisible()"
    [accountFailed]="accountFailed()"
    [snapshot]="accountSnapshot()"
    (reviewRequested)="reviewAccount($event)"
  />

  @if (operatingDeskVisible()) {
    <app-alpaca-hold-banner [target]="target" />

    @if (orderRouteMismatch(); as mismatch) {
      <p class="order-route-notice" role="alert">{{ mismatch }}</p>
    } @else if (manualOrderNotice(); as notice) {
      <p class="order-route-notice" role="alert">{{ notice }}</p>
    }

    <app-alpaca-custody-resolution [target]="target" />

    <app-lens-tabs
      idPrefix="alpaca"
      ariaLabel="Desk perspective"
      [lens]="lens()"
      (lensChange)="selectLens($event)"
    />

    @if (lens() === 'trader') {
      <app-alpaca-trader-lens [refreshVersion]="historyRefreshVersion()" />
    } @else {
      <app-alpaca-operator-lens
        [refreshVersion]="historyRefreshVersion()"
        [timelineQuery]="timelineQuery()"
      />
    }
  }
  }
</main>

@if (operatingDeskVisible()) {
  <p-dialog
    header="Create Alpaca order"
    [visible]="orderEntryOpen()"
    (visibleChange)="orderEntryOpen.set($event)"
    [modal]="true"
    [dismissableMask]="true"
    [style]="{ width: 'min(62rem, calc(100vw - 2rem))' }"
    styleClass="alpaca-order-dialog"
  >
    <app-alpaca-order-entry
      [target]="contextTarget()!"
      [fence]="contextFence()"
      [initialSymbol]="orderPrefill()?.symbol ?? ''"
      [expectedAccountId]="ticketAccountId() ?? ''"
      [manualTicketId]="orderPrefill()?.ticketId ?? null"
      [manualLegId]="orderPrefill()?.legId ?? null"
      [manualCapability]="manualTicketCapability()"
      (submissionFinished)="refreshDesk()"
    />
  </p-dialog>
}
