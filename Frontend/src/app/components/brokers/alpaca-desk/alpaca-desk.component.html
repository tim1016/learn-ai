<main class="alpaca-desk">
  <header class="desk-header">
    <div class="desk-titlebar">
      <div class="desk-title">
        <span class="desk-eyebrow">Broker desk</span>
        <div class="desk-title__line">
          <h1>Alpaca</h1>
          <p-tag severity="warn" value="Paper" />
        </div>
      </div>
      <button type="button" class="deploy-button" (click)="openDeploy()">
        <span aria-hidden="true">＋</span>
        Deploy strategy
      </button>
    </div>

    <app-alpaca-account-card />
  </header>

  <app-alpaca-hold-banner />

  @if (orderRouteMismatch(); as mismatch) {
    <p class="order-route-notice" role="alert">{{ mismatch }}</p>
  } @else if (manualOrderNotice(); as notice) {
    <p class="order-route-notice" role="alert">{{ notice }}</p>
  }

  <app-alpaca-custody-resolution />

  <div class="lens-toggle" role="tablist" aria-label="Desk perspective">
    <button
      id="alpaca-trader-tab"
      data-lens="trader"
      type="button"
      role="tab"
      [class.lens-toggle__tab--active]="lens() === 'trader'"
      [attr.aria-selected]="lens() === 'trader'"
      [attr.tabindex]="lens() === 'trader' ? 0 : -1"
      aria-controls="alpaca-trader-panel"
      (click)="selectLens('trader')"
      (keydown)="onLensKeydown($event)"
    >Trader</button>
    <button
      id="alpaca-operator-tab"
      data-lens="operator"
      type="button"
      role="tab"
      [class.lens-toggle__tab--active]="lens() === 'operator'"
      [attr.aria-selected]="lens() === 'operator'"
      [attr.tabindex]="lens() === 'operator' ? 0 : -1"
      aria-controls="alpaca-operator-panel"
      (click)="selectLens('operator')"
      (keydown)="onLensKeydown($event)"
    >Operator</button>
  </div>

  @if (lens() === 'trader') {
    <app-alpaca-trader-lens [refreshVersion]="historyRefreshVersion()" />
  } @else {
    <app-alpaca-operator-lens [refreshVersion]="historyRefreshVersion()" />
  }
</main>

<app-alpaca-deploy-drawer [visible]="deployOpen()" (closed)="closeDeploy()" />

<p-dialog
  header="Create Alpaca order"
  [visible]="orderEntryOpen()"
  (visibleChange)="orderEntryOpen.set($event)"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: 'min(62rem, calc(100vw - 2rem))' }"
  styleClass="alpaca-order-dialog"
>
  <app-alpaca-order-entry
    [initialSymbol]="orderPrefill()?.symbol ?? ''"
    [expectedAccountId]="ticketAccountId() ?? ''"
    [sqliteManualAuthority]="sqliteManualAuthority()"
    [manualTicketId]="orderPrefill()?.ticketId ?? null"
    [manualLegId]="orderPrefill()?.legId ?? null"
    [manualCapability]="manualTicketCapability()"
    (submissionFinished)="refreshDesk()"
  />
</p-dialog>
