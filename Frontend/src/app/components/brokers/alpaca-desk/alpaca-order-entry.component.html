<div class="order-entry">
  <div class="order-entry__toolbar">
    <div>
      <strong>Order ticket</strong>
      <p>Each leg is journaled separately before submission.</p>
    </div>
    <p-button
      label="Add another"
      icon="pi pi-plus"
      size="small"
      severity="secondary"
      [outlined]="true"
      ariaLabel="Add equity leg"
      (onClick)="addEquityLeg()"
    />
  </div>

  @if (legs().length === 0) {
    <div class="order-empty" role="status">
      <i class="pi pi-file-edit" aria-hidden="true"></i>
      <p>No order legs yet.</p>
      <p-button label="Add equity leg" icon="pi pi-plus" size="small" (onClick)="addEquityLeg()" />
    </div>
  } @else {
    <div class="order-legs" role="list" aria-label="Order legs">
      @for (leg of legs(); track leg.id) {
        <app-alpaca-order-leg-row
          [legForm]="legsForm[$index]"
          [position]="$index"
          (removed)="removeLeg(leg.id)"
        />
      }
    </div>

    <div class="order-entry__footer">
      <div class="order-capabilities">
        <span><i class="pi pi-check" aria-hidden="true"></i> Market</span>
        <span><i class="pi pi-check" aria-hidden="true"></i> Limit</span>
        <span><i class="pi pi-clock" aria-hidden="true"></i> Day or GTC</span>
      </div>
      <p-button
        label="Preview order"
        icon="pi pi-arrow-right"
        iconPos="right"
        size="small"
        [disabled]="!canSubmit()"
        (onClick)="openPreview()"
      />
    </div>
  }

  @if (submitError(); as error) {
    <p-message severity="error">{{ error }}</p-message>
  }

  <app-alpaca-order-results [results]="results()" />
</div>

<app-alpaca-order-preview
  [legs]="legs()"
  [visible]="previewOpen()"
  [submitting]="submitting()"
  (closed)="closePreview()"
  (confirmed)="confirmSubmit()"
/>
