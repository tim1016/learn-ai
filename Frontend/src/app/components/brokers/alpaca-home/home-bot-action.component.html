@switch (control()) {
  @case ('stop') {
    @let phase = stopPhase();
    <!-- Reading keeps the button enabled so the keyboard stays on it (#2634). -->
    <button
      type="button"
      class="home-action home-action--stop"
      [disabled]="phase === 'sending'"
      [attr.aria-busy]="phase !== null"
      [attr.aria-label]="'Stop ' + bot().strategy_instance_id"
      (click)="stopRequested.emit(bot().strategy_instance_id)"
    >{{ phase === 'sending' ? 'Stopping…' : phase === 'reading' ? 'Checking…' : 'Stop' }}</button>
  }
  @case ('flatten') {
    <a
      class="home-action home-action--flatten"
      [routerLink]="botLink()"
      [attr.aria-label]="'Flatten ' + bot().strategy_instance_id + '…'"
    >Flatten…</a>
  }
}
