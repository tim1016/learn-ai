:root[data-theme=&quot;light&quot;] {

* {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  font-weight: var(--font-weight-medium, 500);

  text-underline-offset: 2px;
}

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

  line-height: 1.25;
}

h3,

h5,

}

b,
strong,

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

.table tbody tr:last-child :is(th, td) {

}

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);

.widget {

  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);

#widget &gt; :not(.card, .widget, .progress) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;

    20rem,

    var(--tooltip-available-height, calc(100vh - 10px)),

}

.tabular-nums {

  height: 1px;

  clip: rect(0, 0, 0, 0);

  gap: 2px 12px;
  margin-bottom: 0;

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,

.btn,

function plan(){return `${scope()}&lt;div class=&quot;gs-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Give the study rules before results&lt;/h2&gt;&lt;p&gt;These controls prepare a new protocol revision. Completed evidence keeps its original settings.&lt;/p&gt;&lt;/div&gt;${badge(state.draft?&#x27;Draft revision 3&#x27;:&#x27;Protocol 2&#x27;,&#x27;warn&#x27;)}&lt;/div&gt;&lt;div class=&quot;gs-methods&quot;&gt;&lt;button class=&quot;gs-method&quot; data-method=&quot;zoom&quot; aria-pressed=&quot;${state.method===&#x27;zoom&#x27;}&quot;&gt;&lt;h3&gt;${icon(&#x27;scan-search&#x27;)}Zoom Search ${state.method===&#x27;zoom&#x27;?&#x27;✓&#x27;:&#x27;&#x27;}&lt;/h3&gt;&lt;p&gt;Refine one knob at a time. Useful for many controls; it can miss settings that only work together.&lt;/p&gt;&lt;/button&gt;&lt;button class=&quot;gs-method&quot; data-method=&quot;grid&quot; aria-pressed=&quot;${state.method===&#x27;grid&#x27;}&quot;&gt;&lt;h3&gt;${icon(&#x27;grid-2x2&#x27;)}Grid Search ${state.method===&#x27;grid&#x27;?&#x27;✓&#x27;:&#x27;&#x27;}&lt;/h3&gt;&lt;p&gt;Try every listed combination. Best for small domains or a focused two-knob comparison.&lt;/p&gt;&lt;/button&gt;&lt;/div&gt;&lt;section class=&quot;gs-panel&quot;&gt;&lt;h3&gt;Choose what the search is allowed to change&lt;/h3&gt;&lt;div class=&quot;gs-table-wrap&quot;&gt;&lt;table class=&quot;gs-knobs&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Search&lt;/th&gt;&lt;th&gt;Control / unit&lt;/th&gt;&lt;th&gt;From&lt;/th&gt;&lt;th&gt;To&lt;/th&gt;&lt;th&gt;Smallest step&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${knobs.map(([n,id,lo,hi,step,u,on])=&gt;`&lt;tr&gt;&lt;td&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-knob=&quot;${id}&quot; ${on?&#x27;checked&#x27;:&#x27;&#x27;} aria-label=&quot;Search ${n}&quot;&gt;&lt;/label&gt;&lt;/td&gt;&lt;td&gt;${n}&lt;small&gt;${u}${id===&#x27;gap_bps&#x27;?&#x27; · fixed at 0 by default&#x27;:&#x27;&#x27;}&lt;/small&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; data-edit=&quot;${id}-min&quot; aria-label=&quot;${n} minimum&quot; value=&quot;${lo}&quot; step=&quot;${step}&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; data-edit=&quot;${id}-max&quot; aria-label=&quot;${n} maximum&quot; value=&quot;${hi}&quot; step=&quot;${step}&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; data-edit=&quot;${id}-step&quot; aria-label=&quot;${n} step&quot; value=&quot;${step}&quot; step=&quot;${step}&quot;&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;gs-caption&quot;&gt;Fast EMA must be below slow EMA. Lower RSI must be below upper RSI. Both enabled gap floors must pass.&lt;/div&gt;&lt;div class=&quot;gs-pillrow&quot;&gt;${badge(&#x27;RSI length 14 · fixed&#x27;)}${badge(&#x27;Decision cadence 15 min · fixed&#x27;)}${badge(&#x27;One instrument · SPY&#x27;)}&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Search order and refinement controls&lt;/summary&gt;&lt;div class=&quot;gs-fields&quot;&gt;&lt;label&gt;Points per round&lt;input data-edit=&quot;points&quot; type=&quot;number&quot; value=&quot;5&quot; min=&quot;3&quot; max=&quot;9&quot;&gt;&lt;/label&gt;&lt;label&gt;Refinement rounds&lt;input data-edit=&quot;rounds&quot; type=&quot;number&quot; value=&quot;3&quot; min=&quot;1&quot; max=&quot;5&quot;&gt;&lt;/label&gt;&lt;label&gt;Maximum passes&lt;input data-edit=&quot;passes&quot; type=&quot;number&quot; value=&quot;3&quot; min=&quot;1&quot; max=&quot;5&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;label&gt;Search order&lt;select data-edit=&quot;order&quot;&gt;&lt;option&gt;Gap → RSI gates → EMA periods → hold&lt;/option&gt;&lt;option&gt;EMA periods → hold → gap → RSI gates&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;gs-checkline&quot;&gt;&lt;input data-edit=&quot;pairs&quot; type=&quot;checkbox&quot; checked&gt;Include a bounded Grid audit of EMA and RSI pairs&lt;/label&gt;&lt;p class=&quot;gs-caption&quot;&gt;Pair audits are counted in the workload. If used to select settings, they repeat inside each training window.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;gs-panel&quot;&gt;&lt;h3&gt;What would make you reject a candidate?&lt;/h3&gt;&lt;div class=&quot;gs-fields&quot;&gt;&lt;label&gt;Primary objective&lt;select data-edit=&quot;objective&quot;&gt;&lt;option&gt;Higher Sharpe&lt;/option&gt;&lt;option&gt;Higher net profit&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Maximum drawdown (%)&lt;input data-edit=&quot;drawdown&quot; type=&quot;number&quot; value=&quot;12&quot; min=&quot;1&quot; max=&quot;100&quot;&gt;&lt;/label&gt;&lt;label&gt;Minimum completed trades&lt;input data-edit=&quot;trades&quot; type=&quot;number&quot; value=&quot;30&quot; min=&quot;5&quot;&gt;&lt;/label&gt;&lt;label&gt;Training window (months)&lt;input data-edit=&quot;train&quot; type=&quot;number&quot; value=&quot;6&quot; min=&quot;1&quot;&gt;&lt;/label&gt;&lt;label&gt;Test window (months)&lt;input data-edit=&quot;test&quot; type=&quot;number&quot; value=&quot;2&quot; min=&quot;1&quot;&gt;&lt;/label&gt;&lt;label&gt;Final test (months)&lt;input data-edit=&quot;exam&quot; type=&quot;number&quot; value=&quot;3&quot; min=&quot;1&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;gs-smallcopy&quot;&gt;30 trades is a starting policy, not a guarantee of statistical confidence. A sparse final test can end as “not enough evidence.”&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Capital, fills and trading costs&lt;/summary&gt;&lt;div class=&quot;gs-fields&quot;&gt;&lt;label&gt;Starting capital ($)&lt;input data-edit=&quot;cash&quot; type=&quot;number&quot; value=&quot;100000&quot; step=&quot;1000&quot;&gt;&lt;/label&gt;&lt;label&gt;Fill assumption&lt;select data-edit=&quot;fill&quot;&gt;&lt;option&gt;Next bar open&lt;/option&gt;&lt;option&gt;Signal bar close (exploration)&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Flat fee / order ($)&lt;input data-edit=&quot;fee&quot; type=&quot;number&quot; value=&quot;1&quot; step=&quot;.25&quot;&gt;&lt;/label&gt;&lt;label&gt;Slippage / share ($)&lt;input data-edit=&quot;slippage&quot; type=&quot;number&quot; value=&quot;.01&quot; step=&quot;.01&quot;&gt;&lt;/label&gt;&lt;label&gt;Position size (% capital)&lt;input data-edit=&quot;size&quot; type=&quot;number&quot; value=&quot;10&quot; min=&quot;1&quot; max=&quot;100&quot;&gt;&lt;/label&gt;&lt;label&gt;Cost stress&lt;select data-edit=&quot;stress&quot;&gt;&lt;option&gt;Base + doubled slippage&lt;/option&gt;&lt;option&gt;Base assumptions only&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;gs-caption&quot;&gt;This example uses flat costs, not a historical Alpaca fee schedule. Live data comes from IBKR; Alpaca handles orders.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;div class=&quot;gs-budget&quot; id=&quot;gs-budget&quot;&gt;${budget()}&lt;/div&gt;&lt;div class=&quot;gs-actions&quot;&gt;&lt;p class=&quot;gs-smallcopy&quot;&gt;The final test stays sealed through every development step.&lt;/p&gt;${button(&#x27;Preview search evidence&#x27;,&#x27;search&#x27;,true)}&lt;/div&gt;`;}
function budget(){if(state.draft)return `&lt;div&gt;&lt;strong&gt;Draft changed · preflight required&lt;/strong&gt;&lt;p&gt;The saved results still belong to protocol 2. This preview does not calculate a new engine workload.&lt;/p&gt;&lt;/div&gt;${badge(&#x27;No new study launched&#x27;,&#x27;warn&#x27;)}`;return state.method===&#x27;zoom&#x27;?`&lt;div&gt;&lt;strong&gt;Illustrative Zoom plan: up to 3,480 evaluations&lt;/strong&gt;&lt;p&gt;Includes folds, pair audits, full detail, final test and proof work. Cap: 5,000.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;3–5 hours&lt;/strong&gt;&lt;p&gt;Example estimate · serial execution&lt;/p&gt;&lt;/div&gt;`:`&lt;div&gt;&lt;strong&gt;Full Grid exceeds the 5,000-run budget&lt;/strong&gt;&lt;p&gt;Keep most knobs fixed and use Grid to study a pair. Preflight must count the complete plan.&lt;/p&gt;&lt;/div&gt;${badge(&#x27;Narrow the grid&#x27;,&#x27;warn&#x27;)}`;}
function search(){return `${scope()}&lt;div class=&quot;gs-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Understand where the search went&lt;/h2&gt;&lt;p&gt;Zoom proposes a local improvement. Grid checks whether interacting knobs tell a different story.&lt;/p&gt;&lt;/div&gt;${badge(&#x27;Completed · development only&#x27;)}&lt;/div&gt;&lt;div class=&quot;gs-panel&quot;&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;strong&gt;Zoom Search&lt;/strong&gt;&lt;span&gt;486 evaluated · 134 cached · 18 invalid&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-progress&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Starting value&lt;/th&gt;&lt;th&gt;Retained value&lt;/th&gt;&lt;th&gt;Why it stopped&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Absolute gap&lt;/td&gt;&lt;td&gt;$0.20&lt;/td&gt;&lt;td&gt;$0.15&lt;/td&gt;&lt;td&gt;No better tested move&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RSI gates&lt;/td&gt;&lt;td&gt;50 / 70&lt;/td&gt;&lt;td&gt;48 / 72&lt;/td&gt;&lt;td&gt;Minimum step reached&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EMA pair&lt;/td&gt;&lt;td&gt;5 / 10&lt;/td&gt;&lt;td&gt;8 / 21&lt;/td&gt;&lt;td&gt;No better tested move&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hold length&lt;/td&gt;&lt;td&gt;5 bars&lt;/td&gt;&lt;td&gt;4 bars&lt;/td&gt;&lt;td&gt;No better tested move&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;gs-caption&quot;&gt;Two complete passes. “No improvement” describes the moves tested, not the best configuration everywhere.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gs-columns&quot;&gt;&lt;section class=&quot;gs-panel&quot;&gt;${heatmap()}&lt;/section&gt;&lt;aside class=&quot;gs-aside&quot;&gt;&lt;div&gt;&lt;h3&gt;Use Grid to challenge Zoom&lt;/h3&gt;&lt;p class=&quot;gs-guidance&quot;&gt;Fast and slow EMA can change each other&#x27;s effect. A small pair grid checks combinations the one-knob path did not visit.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Pair audit&lt;/span&gt;&lt;span&gt;22 valid / 3 invalid&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Other settings&lt;/span&gt;&lt;span&gt;Held fixed&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Global optimum&lt;/span&gt;&lt;span&gt;Not established&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;&lt;div class=&quot;gs-actions&quot;&gt;${button(&#x27;Review the plan&#x27;,&#x27;plan&#x27;)}${button(&#x27;See tests over time&#x27;,&#x27;validate&#x27;,true)}&lt;/div&gt;`;}
function validate(){return `${scope()}&lt;div class=&quot;gs-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Did the selection process keep working?&lt;/h2&gt;&lt;p&gt;Six folds begin with Jul–Dec 2023 training, then test Jan–Dec 2024. Each fold searches only its own past.&lt;/p&gt;&lt;/div&gt;${badge(&#x27;Still worked · heuristic&#x27;,&#x27;good&#x27;)}&lt;/div&gt;&lt;div class=&quot;gs-note blue&quot;&gt;${icon(&#x27;shield-check&#x27;)}Original ranges and starting rules repeat in every fold. The all-period winner never seeds an earlier test.&lt;/div&gt;&lt;div class=&quot;gs-panel&quot;&gt;&lt;h3&gt;Selection procedure · forward test periods&lt;/h3&gt;${curve(&#x27;fold&#x27;)}&lt;div class=&quot;gs-pillrow&quot;&gt;${badge(&#x27;6 of 6 folds judged&#x27;)}${badge(&#x27;142 test trades&#x27;)}${badge(&#x27;0.61 median Sharpe retention&#x27;)}&lt;/div&gt;&lt;p class=&quot;gs-caption&quot;&gt;Linked fold returns with independent capital resets and terminal exit costs. This is not the fixed candidate&#x27;s track record.&lt;/p&gt;&lt;div class=&quot;gs-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Test period&lt;/th&gt;&lt;th&gt;Selected EMA&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Train Sharpe&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Test Sharpe&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Net return&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Trades&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${[[&#x27;Jan–Feb 2024&#x27;,&#x27;5 / 15&#x27;,&#x27;1.31&#x27;,&#x27;0.72&#x27;,&#x27;+0.8%&#x27;,&#x27;22&#x27;],[&#x27;Mar–Apr 2024&#x27;,&#x27;8 / 21&#x27;,&#x27;1.42&#x27;,&#x27;0.95&#x27;,&#x27;+1.4%&#x27;,&#x27;26&#x27;],[&#x27;May–Jun 2024&#x27;,&#x27;8 / 26&#x27;,&#x27;1.05&#x27;,&#x27;−0.24&#x27;,&#x27;−0.6%&#x27;,&#x27;19&#x27;],[&#x27;Jul–Aug 2024&#x27;,&#x27;8 / 21&#x27;,&#x27;1.51&#x27;,&#x27;1.02&#x27;,&#x27;+2.3%&#x27;,&#x27;29&#x27;],[&#x27;Sep–Oct 2024&#x27;,&#x27;10 / 21&#x27;,&#x27;1.26&#x27;,&#x27;0.66&#x27;,&#x27;+0.9%&#x27;,&#x27;21&#x27;],[&#x27;Nov–Dec 2024&#x27;,&#x27;8 / 21&#x27;,&#x27;1.38&#x27;,&#x27;0.92&#x27;,&#x27;+1.3%&#x27;,&#x27;25&#x27;]].map(row=&gt;`&lt;tr&gt;${row.map((t,i)=&gt;`&lt;td class=&quot;${i&gt;1?&#x27;num&#x27;:&#x27;&#x27;}&quot;&gt;${t}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;gs-note&quot;&gt;${icon(&#x27;info&#x27;)}One test period lost money. The retained legacy verdict is a rule-of-thumb summary; it is not a probability of future profit.&lt;/div&gt;&lt;div class=&quot;gs-actions&quot;&gt;${button(&#x27;Inspect search path&#x27;,&#x27;search&#x27;)}${button(&#x27;Compare fixed candidates&#x27;,&#x27;compare&#x27;,true)}&lt;/div&gt;`;}
function weakEvidence(){return state.scenario===&#x27;sparse&#x27;||state.scenario===&#x27;reused&#x27;||state.candidate===&#x27;recent&#x27;;}
function escaped(value){return value.replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));}
function tuple(){const c=candidates[state.candidate];return `&lt;section class=&quot;gs-panel&quot;&gt;&lt;div class=&quot;gs-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;${state.approved?&#x27;Your golden settings&#x27;:&#x27;The exact settings you are approving&#x27;}&lt;/h3&gt;&lt;p&gt;EMA crossover · SPY · program version gs-preview-v3&lt;/p&gt;&lt;/div&gt;${badge(state.approved?&#x27;Golden v2 · preview&#x27;:&#x27;Candidate · not yet qualified&#x27;,state.approved?&#x27;good&#x27;:&#x27;&#x27;)}&lt;/div&gt;&lt;p&gt;&lt;strong&gt;${c.params}&lt;/strong&gt;&lt;/p&gt;&lt;div class=&quot;gs-pillrow&quot;&gt;${badge(&#x27;Normalized gap 0 bps&#x27;)}${badge(&#x27;RSI length 14&#x27;)}${badge(&#x27;Decision cadence 15 min&#x27;)}&lt;/div&gt;&lt;p class=&quot;gs-caption&quot;&gt;${state.approved?&#x27;Qualification gs-preview-024-v2 · new default for this strategy and instrument.&#x27;:&#x27;Replaces the default: gap $0.20, RSI 50–70, EMA 5/10, hold 5 bars; fixed values unchanged.&#x27;} Existing bots keep their pinned version. No bot starts on approval.&lt;/p&gt;&lt;/section&gt;`;}
function deploy(){return `${scope()}&lt;div class=&quot;gs-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Use your golden configuration&lt;/h2&gt;&lt;p&gt;The approved version arrives in Deploy with its exact settings and evidence attached.&lt;/p&gt;&lt;/div&gt;${badge(&#x27;Deploy handoff · preview&#x27;)}&lt;/div&gt;${tuple()}&lt;section class=&quot;gs-panel&quot;&gt;&lt;h3&gt;Choose how to use it&lt;/h3&gt;&lt;div class=&quot;gs-fields&quot;&gt;&lt;label&gt;Execution mode&lt;select id=&quot;gs-deploy-mode&quot;&gt;&lt;option ${state.mode===&#x27;Paper&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Paper&lt;/option&gt;&lt;option ${state.mode===&#x27;Live&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Live&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Golden review&lt;/span&gt;&lt;strong&gt;Accepted · Manual override&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Research evidence&lt;/span&gt;&lt;span&gt;${weakEvidence()?&#x27;Weak evidence · override recorded&#x27;:&#x27;Meets the stated rules&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Selected mode&lt;/span&gt;&lt;strong&gt;${state.mode}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Account and operating checks&lt;/span&gt;&lt;span&gt;Required in Deploy&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;gs-guidance&quot;&gt;Choose a matching ${state.mode} account in the Alpaca account desk. Coverage, custody, arming, canary and risk checks still apply. Live market data remains IBKR; orders go to Alpaca.&lt;/p&gt;&lt;div class=&quot;gs-note&quot;&gt;${icon(&#x27;info&#x27;)}This preview stops at the handoff. No connected account or start command is present.&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;gs-actions&quot;&gt;${button(&#x27;Back to golden settings&#x27;,&#x27;decision&#x27;)}&lt;/div&gt;`;}
function decision(){const c=candidates[state.candidate];
 if(state.retained)return `&lt;div class=&quot;gs-lockbox&quot;&gt;&lt;div class=&quot;gs-lockicon&quot;&gt;${icon(&#x27;check&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;h2&gt;Current settings retained&lt;/h2&gt;&lt;p&gt;The study and its trial history remain available. ${state.exam?&#x27;The opened final test remains recorded as exposed.&#x27;:&#x27;The final test has not been opened.&#x27;}&lt;/p&gt;${badge(&#x27;Research decision recorded · preview&#x27;)}${button(&#x27;Return to evidence&#x27;,&#x27;compare&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
 if(!state.exam)return `${scope()}&lt;div class=&quot;gs-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;One candidate. One final look.&lt;/h2&gt;&lt;p&gt;The choice becomes fixed when you open the test. Changing your mind afterwards needs fresh evidence.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;gs-lockbox&quot;&gt;&lt;div class=&quot;gs-lockicon&quot;&gt;${icon(&#x27;lock-keyhole&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;h2&gt;Jan – Mar 2025 is still sealed&lt;/h2&gt;&lt;p&gt;Only &lt;strong&gt;${c.name}&lt;/strong&gt; and the frozen incumbent will be evaluated. The other candidate will not run on this final interval.&lt;/p&gt;&lt;div class=&quot;gs-timeline&quot;&gt;&lt;div&gt;&lt;strong&gt;Development&lt;/strong&gt;&lt;small&gt;Jan 2023 – Dec 2024 · used to choose&lt;/small&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Final test&lt;/strong&gt;&lt;small&gt;Jan – Mar 2025 · locked&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Selected settings&lt;/span&gt;&lt;strong&gt;${c.name}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Profit after stated costs&lt;/span&gt;&lt;span&gt;Must be positive&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Worst drawdown / activity&lt;/span&gt;&lt;span&gt;≤ 12% / ≥ 30 trades&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Incumbent comparison&lt;/span&gt;&lt;span&gt;Higher Sharpe, within risk limits&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-rule&quot;&gt;&lt;span&gt;Recorded exposure&lt;/span&gt;&lt;span&gt;${state.scenario===&#x27;reused&#x27;?&#x27;Previously used · exploratory only&#x27;:&#x27;Not opened in recorded research&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;gs-caption&quot;&gt;Exposure outside this application cannot be verified. A historical test is not a guarantee of future results.&lt;/p&gt;${state.candidate===&#x27;recent&#x27;?&#x27;&lt;div class=&quot;gs-note&quot;&gt;This candidate exceeds the
