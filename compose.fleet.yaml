# ADR 0062 production fleet overlay. Run this with compose.yaml and the fleet
# profile so the existing database/data-lake plane is preserved while the
# combined Python process is replaced by an explicit coordinator and Clerks.
name: learn-ai-fleet

x-fleet-agent: &fleet-agent
  build:
    context: ./PythonDataService
  image: ${FLEET_IMAGE:-learn-ai-fleet-agent:local}
  profiles: ["fleet"]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
    # Import-time read surfaces use this non-authoritative cache even in an
    # agent role. Keep it bounded and lane-local inside the read-only image.
    - /app/cache:size=256m,mode=1777
  pids_limit: 256
  cpus: "1.00"
  mem_limit: 768m
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 30s
  environment: &fleet-agent-environment
    FLEET_DEPLOYMENT_NAMESPACE: ${FLEET_DEPLOYMENT_NAMESPACE:-compose:learn-ai-fleet}
    ALPACA_CLERK_DIR: /app/artifacts/alpaca_clerk
    IBKR_LIVE_RUNS_ROOT: /app/artifacts/alpaca_clerk/live_runs
    IBKR_LIVE_BARS_ROOT: /app/artifacts/alpaca_clerk/live_bars
    BROKER_CAPTURE_DIR: /app/artifacts/alpaca_clerk/broker_captures
    IBKR_READONLY: "true"
    IBKR_BROKER_ENABLED: "true"
    IBKR_HOST: auto
    IBKR_PORT: "4002"
    # The current Settings construction requires a value; lane market data is
    # still the retained read-only IBKR feed below, never coordinator-owned.
    POLYGON_API_KEY: ""
    FLEET_MAX_INFLIGHT_REQUESTS: ${FLEET_MAX_INFLIGHT_REQUESTS:-16}
    FLEET_MAX_INFLIGHT_STREAMS: ${FLEET_MAX_INFLIGHT_STREAMS:-4}
    FLEET_REQUEST_QUEUE_LIMIT: ${FLEET_REQUEST_QUEUE_LIMIT:-64}
    FLEET_REQUEST_QUEUE_TIMEOUT_MS: ${FLEET_REQUEST_QUEUE_TIMEOUT_MS:-5000}
    TRUSTED_HOSTS: localhost,127.0.0.1,alpaca-paper-clerk,alpaca-live-clerk,fleet-coordinator
  extra_hosts:
    - "host.containers.internal:host-gateway"
    - "host.docker.internal:host-gateway"
  networks:
    - fleet-private

services:
  fleet-coordinator:
    build:
      context: ./PythonDataService
    image: ${FLEET_IMAGE:-learn-ai-fleet-agent:local}
    profiles: ["fleet"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    pids_limit: 192
    cpus: "1.00"
    mem_limit: 768m
    env_file:
      - path: ${FLEET_COORDINATOR_ENV_FILE:-./deploy/fleet/env/coordinator.env}
        required: false
    environment:
      FLEET_ROLE: fleet_coordinator
      FLEET_CONTROL_DIR: /app/artifacts/fleet
      LEAN_DATA_ROOT: /lean-data
      LEAN_DATA_CACHE: /lean-cache
      LEAN_DATA_WRITE_ROOT: /lean-data-writer
      LEAN_LAUNCHER_URL: ${LEAN_LAUNCHER_URL:-http://host.containers.internal:8090}
      BACKEND_URL: http://backend:8080
      # These are the existing data-plane stores from compose.yaml. Fleet is
      # a role split, never a second catalog or job authority.
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the shared data plane}@db:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      # A2 makes coordinator the data-plane market-data owner. This is not a
      # broker execution credential and agent lanes never inherit it.
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      POLYGON_RATE_LIMIT_PER_MIN: ${POLYGON_RATE_LIMIT_PER_MIN:-0}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FLEET_DEPLOYMENT_NAMESPACE: ${FLEET_DEPLOYMENT_NAMESPACE:-compose:learn-ai-fleet}
      FLEET_MAX_INFLIGHT_REQUESTS: ${FLEET_MAX_INFLIGHT_REQUESTS:-32}
      FLEET_MAX_INFLIGHT_STREAMS: ${FLEET_MAX_INFLIGHT_STREAMS:-8}
      FLEET_REQUEST_QUEUE_LIMIT: ${FLEET_REQUEST_QUEUE_LIMIT:-128}
      FLEET_REQUEST_QUEUE_TIMEOUT_MS: ${FLEET_REQUEST_QUEUE_TIMEOUT_MS:-5000}
      TRUSTED_HOSTS: localhost,127.0.0.1,fleet-coordinator,backend
    volumes:
      - fleet-coordinator-control:/app/artifacts/fleet
      - fleet-coordinator-artifacts:/app/artifacts
      # Preserve the existing coordinator-owned research/data-lake plane. The
      # qualification overlay replaces these binds with isolated named volumes.
      - ../Lean/Data:/lean-data:ro,z
      - ./PythonDataService/lean-cache:/lean-cache:z
      - ./PythonDataService/cache:/app/cache:z
      - ${LEAN_DATA_VOLUME_HOST_PATH:-./data-lake-volume}:/lean-data-writer:rw,z
    ports:
      # The coordinator is the only public fleet surface. Clerk agents have
      # no host port and are reachable only on fleet-private.
      - "127.0.0.1:${FLEET_COORDINATOR_PORT:-8100}:8000"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    networks:
      - fleet-private
      # The full-stack overlay joins this existing application network so the
      # Backend and Frontend can use the coordinator as their sole data-plane
      # ingress. Clerk agents never join it.
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  alpaca-paper-clerk:
    <<: *fleet-agent
    env_file:
      - path: ${FLEET_PAPER_ENV_FILE:-./deploy/fleet/env/paper.env}
        required: false
    environment:
      <<: *fleet-agent-environment
      FLEET_ROLE: clerk_agent
      FLEET_COORDINATOR_URL: http://fleet-coordinator:8000
      FLEET_AGENT_ENDPOINT_REF: alpaca-paper-agent
    volumes:
      - fleet-alpaca-paper-data:/app/artifacts/alpaca_clerk

  alpaca-live-clerk:
    <<: *fleet-agent
    env_file:
      - path: ${FLEET_LIVE_ENV_FILE:-./deploy/fleet/env/live.env}
        required: false
    environment:
      <<: *fleet-agent-environment
      FLEET_ROLE: clerk_agent
      FLEET_COORDINATOR_URL: http://fleet-coordinator:8000
      FLEET_AGENT_ENDPOINT_REF: alpaca-live-agent
      # This is deliberately not an enablement switch. Existing per-account
      # arming and Live gates remain the sole authority for any mutation.
    volumes:
      - fleet-alpaca-live-data:/app/artifacts/alpaca_clerk

  # Full-stack overlay only: keep the historical combined process available
  # for rollback, but never start it in a fleet deployment.
  python-service:
    profiles: ["legacy-combined"]

  backend:
    profiles: ["fleet"]
    environment:
      PolygonService__BaseUrl: http://fleet-coordinator:8000
    depends_on: !override
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fleet-coordinator:
        condition: service_healthy

  frontend:
    profiles: ["fleet"]
    environment:
      DATA_PLANE_PROXY_TARGET: http://fleet-coordinator:8000
    depends_on: !override
      backend:
        condition: service_healthy

volumes:
  fleet-coordinator-control:
  fleet-coordinator-artifacts:
  fleet-alpaca-paper-data:
  fleet-alpaca-live-data:

networks:
  # Defined in compose.yaml for the full stack; repeated identically so this
  # fleet file can still render as its own deployment topology.
  app-network:
    driver: bridge
  fleet-private:
    driver: bridge
    # Agents publish no ports but retain outbound broker/market-data egress.
    # An internal-only network would silently prevent those required dependencies.
