<title>Bot Page Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the app's own dark chrome, then one bot banner (summary + action toolbar),
   then a no-scroll board on a 12-column grid (6·3·3 and alternatives). */
:root {
  color-scheme: dark;
  --canvas: #0b0e14;
  --surface: #131722;
  --elevated: #1b1f2e;
  --hover: #242938;
  --sunken: #070a11;
  --line: #1e222d;
  --line-2: #2a2e39;
  --line-3: #363a45;
  --fg: #f0f3fa;
  --fg-2: #b2b5be;
  --fg-3: #9598a1;
  --fg-4: #6b6f7a;
  --accent: #2962ff;
  --accent-text: #7aa9ff;
  --accent-faint: rgba(41, 98, 255, 0.08);
  --accent-soft: rgba(41, 98, 255, 0.16);
  --bull: #26a69a;
  --bull-soft: rgba(38, 166, 154, 0.15);
  --bear: #ef5350;
  --bear-soft: rgba(239, 83, 80, 0.14);
  --warn: #ff9800;
  --warn-soft: rgba(255, 152, 0, 0.14);
  --ema-fast: #f2ad3d;
  --ema-slow: #4d8dff;
  --rsi: #a78bfa;
  /* Dark Bright Gate: hue = candle direction, shade = gate result */
  --up-bright: #22c2a8;
  --up-dark: #123f3a;
  --up-dark-edge: #1f6b61;
  --down-bright: #f4534f;
  --down-dark: #4f1f1f;
  --down-dark-edge: #8c3532;
  --proto-bg: #f0f3fa;
  --proto-fg: #0b0e14;
  --proto-line: #c9ccd4;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xxs: 0.65rem;
  --fs-xs: 0.72rem;
  --fs-sm: 0.8rem;
  --fs-base: 0.875rem;
  --fs-md: 0.95rem;
  --fs-lg: 1.1rem;
  --r: 6px;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--fg);
  font: var(--fs-base)/1.4 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

/* ── App chrome (unchanged app-wide, compressed) ───────────────────── */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 8px 16px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #121620, var(--canvas));
}
.topbar nav { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--fg-3); flex: 1; min-width: 0; }
.topbar nav b { color: var(--accent-text); font-weight: 600; }
.logo {
  font: 800 0.85rem/1 var(--font-sans); letter-spacing: 0.12em; color: #f2ad3d;
  padding: 6px 12px; border: 1px solid #5a3b14; border-radius: 6px; background: #1a1209;
}
.pills { display: flex; gap: 6px; flex: 1; justify-content: flex-end; }
.pill { font-size: var(--fs-xs); font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-3); }
.pill--live { border-color: var(--bear); color: #ffb4b2; }
.pill--live::before { content: "●"; color: var(--warn); margin-right: 5px; }
.pill--att { border-color: #8a5a12; background: #3a2508; color: #ffcf8a; }
.pill--paper { border-color: #2a7f8a; color: #9fe3ec; }

.acct {
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--line-2);
  background: linear-gradient(180deg, #1a1218 0%, var(--surface) 100%);
  border-top: 2px solid #7a2a2a;
}
.acct__name { font-weight: 700; font-size: var(--fs-md); }
.chip-live { font: 600 var(--fs-xxs)/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 9px; border-radius: 999px; background: var(--bear); color: #fff; }
.tabs { display: flex; gap: 4px; }
.tabs a { color: var(--fg-3); text-decoration: none; font-size: var(--fs-sm); padding: 4px 9px; border-radius: 4px; }
.tabs a.on { color: var(--fg); background: var(--hover); }
.acct__money { display: flex; gap: 18px; margin-left: auto; }
.acct__money div { display: grid; }
.acct__money span { font-size: var(--fs-xxs); color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.05em; }
.acct__money b { font: 500 var(--fs-sm) var(--font-mono); }
.btn-ghost { border: 1px solid var(--line-3); background: transparent; border-radius: 5px; padding: 5px 11px; font-size: var(--fs-sm); color: var(--fg-2); cursor: pointer; }

/* ── Bot banner: summary row + toolbar row ─────────────────────────── */
.botbar { padding: 10px 16px 0; display: grid; gap: 8px; }
.botbar__row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; min-width: 0; }
.crumb { color: var(--fg-3); text-decoration: none; font-size: var(--fs-sm); }
.crumb:hover { color: var(--fg); }
.botname { font: 600 var(--fs-lg)/1.2 var(--font-mono); margin: 0; letter-spacing: -0.01em; }
.botmeta { color: var(--fg-3); font-size: var(--fs-sm); }
.botmeta b { color: var(--fg); font-weight: 600; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status--running { color: var(--bull); background: var(--bull-soft); }
.status--running::before { animation: pulse 1.6s ease-in-out infinite; }
.status--finished { color: var(--fg-2); background: var(--hover); }
.status--holding { color: var(--warn); background: var(--warn-soft); }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .status--running::before { animation: none; } }
.summary { color: var(--fg-2); font-size: var(--fs-base); margin: 0; flex: 1 1 360px; min-width: 0; }
.summary b { color: var(--fg); font-weight: 600; }
.figs { display: flex; gap: 16px; margin-left: auto; }
.fig { display: grid; justify-items: end; }
.fig span { font-size: var(--fs-xxs); color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.05em; }
.fig b { font: 600 var(--fs-md) var(--font-mono); }
.up { color: var(--bull); } .down { color: var(--bear); }

.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 0 10px; border-bottom: 1px solid var(--line-2); }
.tgroup { display: flex; align-items: center; gap: 4px; padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--line-2); }
.tgroup:last-of-type { border-right: 0; }
.tgroup__name { font-size: var(--fs-xxs); color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 2px; }
.tb {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 32px; min-width: 32px; padding: 0 8px; justify-content: center;
  border-radius: 6px; border: 1px solid var(--line-3); background: var(--elevated);
  color: var(--fg-2); cursor: pointer; font-size: var(--fs-sm);
}
.tb:hover { background: var(--hover); color: var(--fg); }
.tb svg { width: 16px; height: 16px; stroke-width: 2; }
.tb__label { display: none; white-space: nowrap; }
.tb--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb--primary:hover { background: #1e53e5; color: #fff; }
.tb--danger { color: #ffb4b2; border-color: #5a2a2c; }
.tb--danger:hover { background: var(--bear-soft); }
.tb--primary .tb__label, .tb--danger.tb--keylabel .tb__label, body.labels .tb__label { display: inline; }
.tb[data-tip]:hover::after, .tb[data-tip]:focus-visible::after {
  content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  width: max-content; max-width: 260px; white-space: normal; text-align: left;
  background: var(--sunken); color: var(--fg-2); border: 1px solid var(--line-3);
  border-radius: 5px; padding: 6px 8px; font-size: var(--fs-xs); font-weight: 400; line-height: 1.35;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: none;
}
.toolbar__fresh { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-4); display: flex; align-items: center; gap: 6px; }
.toolbar__fresh i { width: 6px; height: 6px; border-radius: 50%; background: var(--bull); display: inline-block; }
.example-flag { font-size: var(--fs-xs); color: var(--warn); border: 1px dashed #6b4a14; border-radius: 4px; padding: 2px 8px; }

/* ── Board ─────────────────────────────────────────────────────────── */
.board { flex: 1; min-height: 0; padding: 12px 16px 64px; }
.grid { display: grid; gap: 12px; height: 100%; min-height: 0; }
.gridA { grid-template-columns: 6fr 3fr 3fr; grid-template-rows: minmax(0, 1.75fr) minmax(0, 1fr); }
.gridB { grid-template-columns: 6fr 3fr 3fr; grid-template-rows: minmax(0, 1fr); }
.gridC { grid-template-columns: 9fr 3fr; grid-template-rows: minmax(0, 1fr); }
.stack { display: grid; gap: 12px; min-height: 0; }
.stack--3 { grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr); }

.panel { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel__head { display: flex; align-items: baseline; gap: 8px; padding: 9px 12px 7px; border-bottom: 1px solid var(--line); }
.panel__title { font-size: var(--fs-xs); font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }
.panel__sub { font-size: var(--fs-xs); color: var(--fg-4); margin-left: auto; text-align: right; }
.panel__body { padding: 10px 12px; overflow: auto; min-height: 0; flex: 1; display: grid; align-content: start; gap: 10px; }
.panel--chart .panel__body { padding: 0; overflow: hidden; display: block; }
.chart-host { width: 100%; height: 100%; min-height: 170px; position: relative; }
.chart-host svg { display: block; }

.hero { display: grid; gap: 2px; }
.hero b { font: 600 1.35rem/1.15 var(--font-mono); }
.hero span { font-size: var(--fs-sm); color: var(--fg-3); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 16px; margin: 0; font-size: var(--fs-sm); }
.kv dt { white-space: nowrap; }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kv .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 2px 0; }
.note { font-size: var(--fs-xs); color: var(--fg-4); margin: 0; }
.sect { font-size: var(--fs-xxs); color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.06em; margin: 2px 0 0; }

.dlist { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.dlist li { display: grid; grid-template-columns: 44px 1fr; gap: 2px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.dlist li:last-child { border-bottom: 0; }
.dlist time { font-family: var(--font-mono); color: var(--fg-3); font-size: var(--fs-xs); padding-top: 1px; }
.dlist .what { font-weight: 600; }
.dlist .why { grid-column: 2; color: var(--fg-3); font-size: var(--fs-xs); }
.dlist li.next { color: var(--fg-4); }
.dlist li.next .what { font-weight: 400; }
.tag { font-size: var(--fs-xxs); font-weight: 600; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
.tag--none { background: var(--hover); color: var(--fg-3); }
.tag--buy { background: var(--bull-soft); color: var(--bull); }
.tag--ex { background: var(--warn-soft); color: var(--warn); }

.health { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.health li { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; align-items: baseline; font-size: var(--fs-sm); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--fg-4); }
.dot--ok { background: var(--bull); } .dot--bad { background: var(--bear); } .dot--warn { background: var(--warn); } .dot--off { background: var(--line-3); }
.health .val { color: var(--fg-2); font-size: var(--fs-xs); text-align: right; }
.health .why { grid-column: 2 / -1; color: var(--fg-4); font-size: var(--fs-xs); }
.health a { color: var(--accent-text); text-decoration: none; }

.hash { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 8px; align-items: center; font-size: var(--fs-xs); }
.hash dt { color: var(--fg-3); }
.hash dd { margin: 0; font-family: var(--font-mono); color: var(--fg-2); }
.copy { border: 0; background: transparent; color: var(--fg-4); cursor: pointer; padding: 2px; display: inline-flex; }
.copy:hover { color: var(--fg); }
.copy svg { width: 13px; height: 13px; }
.proven { color: var(--bull); font-weight: 600; }
.strategy { font-size: var(--fs-sm); color: var(--fg-2); margin: 0; }

.path { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.path span { font-size: var(--fs-xxs); text-align: center; padding: 5px 2px; border-radius: 3px; background: var(--hover); color: var(--fg-4); }
.path span.done { background: var(--bull-soft); color: var(--bull); }
.path span.wait { background: var(--warn-soft); color: var(--warn); }
.orders { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: var(--fs-sm); }
.orders li { display: flex; justify-content: space-between; gap: 10px; }
.orders .m { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--fg-2); }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.cols2 > div { display: grid; gap: 6px; align-content: start; min-width: 0; }

.feed { list-style: none; margin: 0; padding: 0; position: relative; }
.feed::before { content: ""; position: absolute; left: 51px; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
.feed li { display: grid; grid-template-columns: 44px 16px 1fr; gap: 0 6px; padding: 5px 0; font-size: var(--fs-sm); position: relative; }
.feed time { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--fg-3); padding-top: 1px; }
.feed .mk { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--fg-4); background: var(--surface); margin: 4px 0 0 1px; z-index: 1; }
.feed .mk--life { border-color: var(--accent-text); }
.feed .mk--dec { border-color: var(--fg-3); }
.feed .mk--buy { border-color: var(--bull); background: var(--bull); }
.feed .mk--data { border-color: var(--warn); }
.feed .mk--money { border-color: var(--bull); }
.feed .why { grid-column: 3; color: var(--fg-4); font-size: var(--fs-xs); }
.feed li.next { color: var(--fg-4); }

.itabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.itabs button { border: 0; background: transparent; color: var(--fg-3); padding: 6px 9px; font-size: var(--fs-sm); cursor: pointer; border-bottom: 2px solid transparent; }
.itabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.svg-t { font: 10px var(--font-mono); fill: var(--fg-4); }
.svg-t2 { font: 10px var(--font-sans); fill: var(--fg-3); }
.svg-tb { font: 600 10px var(--font-sans); fill: var(--fg-2); }

/* Popovers, toast, prototype bar, notes */
.pop {
  position: fixed; z-index: 40; width: min(440px, calc(100vw - 32px)); max-height: min(70vh, 560px); overflow: auto;
  background: var(--elevated); border: 1px solid var(--line-3); border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); padding: 12px;
}
.pop h3 { margin: 0 0 8px; font-size: var(--fs-md); }
.alist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.alist li { display: grid; grid-template-columns: 22px 1fr auto; gap: 1px 8px; padding: 6px 4px; border-radius: 4px; font-size: var(--fs-sm); }
.alist li svg { width: 15px; height: 15px; margin-top: 2px; color: var(--fg-3); }
.alist .st { font-size: var(--fs-xxs); font-weight: 600; padding: 2px 6px; border-radius: 3px; align-self: start; }
.alist .st--on { background: var(--bull-soft); color: var(--bull); }
.alist .st--off { background: var(--hover); color: var(--fg-4); }
.alist .r { grid-column: 2 / -1; color: var(--fg-4); font-size: var(--fs-xs); }
.alist .sys { font-family: var(--font-mono); font-size: var(--fs-xxs); color: var(--fg-4); opacity: 0.8; }
.toast {
  position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 50;
  background: var(--sunken); border: 1px solid var(--line-3); color: var(--fg-2); padding: 8px 14px; border-radius: 6px; font-size: var(--fs-sm);
  max-width: calc(100vw - 32px);
}
.proto {
  position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 45;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
  background: var(--proto-bg); color: var(--proto-fg); border-radius: 999px; padding: 5px 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6); font-size: var(--fs-sm); max-width: calc(100vw - 24px);
}
.proto button { border: 0; background: transparent; color: var(--proto-fg); cursor: pointer; border-radius: 999px; padding: 4px 10px; font-weight: 500; }
.proto button:hover { background: #dfe3ea; }
.proto button[aria-pressed="true"] { background: var(--proto-fg); color: var(--proto-bg); }
.proto .vlabel { font-weight: 700; padding: 0 4px; min-width: 132px; text-align: center; }
.proto .divider { width: 1px; height: 18px; background: var(--proto-line); }
.notes {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(440px, 100vw); overflow: auto;
  background: var(--elevated); border-left: 1px solid var(--line-3); box-shadow: -12px 0 32px rgba(0,0,0,0.5); padding: 18px 20px 80px;
}
.notes h2 { font-size: var(--fs-lg); margin: 0 0 4px; }
.notes h3 { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); margin: 18px 0 6px; }
.notes ol, .notes ul { padding-left: 18px; margin: 0; display: grid; gap: 7px; font-size: var(--fs-sm); color: var(--fg-2); }
.notes b { color: var(--fg); }
.notes table { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
.notes td { padding: 4px 6px; border-bottom: 1px solid var(--line-2); vertical-align: top; color: var(--fg-2); }
.notes td:first-child { font-family: var(--font-mono); color: var(--fg-4); }
.notes .x { float: right; }

/* Strategy view (#2639) */
.chart-head { flex-wrap: wrap; align-items: center; row-gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line-3); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--fg-3); padding: 3px 9px; font-size: var(--fs-xs); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--hover); color: var(--fg); }
.chipbtn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-3); background: var(--elevated); color: var(--fg-2); border-radius: 6px; padding: 3px 7px; font-size: var(--fs-xs); cursor: pointer; }
.chipbtn:hover { background: var(--hover); color: var(--fg); }
.chipbtn svg { width: 13px; height: 13px; }
.chipbtn small { color: var(--accent-text); font-size: var(--fs-xxs); }
.legend { display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 5px 12px; font-size: var(--fs-xs); color: var(--fg-3); border-bottom: 1px solid var(--line); align-items: center; }
.legend .sw { display: inline-block; width: 8px; height: 11px; border-radius: 1px; vertical-align: -1px; margin-right: 2px; }
.legend .ln { display: inline-block; width: 14px; height: 2px; vertical-align: 3px; margin-right: 4px; }
.legend .hint { margin-left: auto; color: var(--fg-4); }
.legend .src { color: var(--fg-4); }
@media (max-width: 1500px) { .legend .hint { display: none; } }
.ck { display: inline-flex; gap: 3px; font: 500 var(--fs-xxs)/1.6 var(--font-mono); padding: 0 5px; border-radius: 3px; white-space: nowrap; }
.ck--ok { background: var(--bull-soft); color: var(--bull); }
.ck--no { background: var(--bear-soft); color: #ff8a87; }
.cks { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 2; }
.dlist li.drow { cursor: pointer; border-radius: 3px; }
.dlist li.drow:hover { background: var(--elevated); }
.dlist li.sel { background: var(--accent-faint); box-shadow: inset 2px 0 0 var(--accent-text); }
.dlist li.before .what { color: var(--fg-3); font-weight: 500; }
.dlist li.startline { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 0; font-size: var(--fs-xxs); color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.06em; }
.dlist li.startline::before, .dlist li.startline::after { content: ""; flex: 1; border-top: 1px solid var(--accent-text); opacity: 0.4; }

  { id: 'rule', name: 'RSI in 50–70', owner: 'strategy', expr: 'rsi_min ≤ RSI14 ≤ rsi_max', test: r => r.rsi >= SETTINGS.rsi_min && r.rsi <= SETTINGS.rsi_max },
  { id: 'gap', name: 'EMA gap clears the minimum', owner: 'mine', expr: 'EMA5 − EMA10 − gap > 0', test: r => r.e5 - r.e10 - SETTINGS.gap > 0 },
  { id: 'above', name: 'Close above EMA 10', owner: 'mine', expr: 'close − EMA10 > 0', test: r => r.c - r.e10 > 0 },
];
const CATALOG = ['VWAP', 'EMA 20', 'SMA 50', 'Bollinger Bands (20, 2)', 'ATR 14', 'MACD (12, 26, 9)', 'Stochastic (14, 3)', 'OBV'];
const gate = () => GATES.find(g => g.id === state.gate) || GATES[0];
const center = r => r.ts - 7.5 * MIN;

function checks(r) {
  const gap = r.e5 - r.e10;
  return [
    { k: 'Fresh cross', chip: 'cross', val: r.fresh ? 'yes' : gap > 0 ? 'no, above' : 'no, below', rule: 'needs cross up', ok: r.fresh },
    { k: 'Gap', chip: `gap ${sgn(gap)}`, val: sgn(gap), rule: `needs ≥ ${SETTINGS.gap.toFixed(2)}`, ok: gap >= SETTINGS.gap },
    { k: 'RSI', chip: `RSI ${r.rsi.toFixed(1)}`, val: r.rsi.toFixed(1), rule: `needs ${SETTINGS.rsi_min}–${SETTINGS.rsi_max}`, ok: r.rsi >= SETTINGS.rsi_min && r.rsi <= SETTINGS.rsi_max },
  ];
}
const chips = r => `<span class="cks">${checks(r).map(c => `<span class="ck ck--${c.ok ? 'ok' : 'no'}">${c.ok ? '✓' : '✗'} ${c.chip}</span>`).join('')}</span>`;
const checksTable = r => `<table class="checks">${checks(r).map(c => `<tr><td>${c.k}</td><td>${c.val}</td><td>${c.rule}</td><td class="${c.ok ? 'ok' : 'no'}">${c.ok ? '✓' : '✗'}</td></tr>`).join('')}</table>
  <p class="vals">EMA 5 ${r.e5.toFixed(2)} · EMA 10 ${r.e10.toFixed(2)} · RSI ${r.rsi.toFixed(1)} · bot’s own values</p>`;
const phaseOf = r => r.ts < T.runStart ? 'Before start · not acted on' : r.ts > T.runEnd ? 'After end · not acted on' : 'No action';

function decisionRows(st) {
  const lim = st === 'running' ? T.now : Infinity;
  return S.filter(r => r.ts <= lim && r.ts > T.runStart - 15 * MIN && r.ts <= T.runEnd)
    .map(r => ({ ...r, before: r.ts < T.runStart }));
}
const barAt = ts => DATA.bars.find(b => b[0] === ts);
const lastBarBefore = ts => DATA.bars.filter(b => b[0] + MIN <= ts).at(-1);
const HOLD = (() => {
  const fill = barAt(1790794320000)[1];
  const last = DATA.bars.at(-1)[4];
  return { fill, last, pnl: +(last - fill).toFixed(2) };
})();

// ── Pieces shared by every layout ─────────────────────────────────────
const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
function banner(m) {
  const groups = [];
  let cur = [];
  for (const id of m.actions) { if (id === '|') { groups.push(cur); cur = []; } else cur.push(id); }
  groups.push(cur);
  const tb = groups.map(g => {
    const name = ACTIONS[g[0]].group;
    return `<div class="tgroup" role="group" aria-label="${name}"><span class="tgroup__name">${name}</span>${g.map(id => {
      const a = ACTIONS[id];
      const tone = a.tone ? ` tb--${a.tone}` : '';
      const key = id === 'stop' || id === 'sell' ? ' tb--keylabel' : '';
      return `<button type="button" class="tb${tone}${key}" data-act="${id}" data-tip="${a.tip}" aria-label="${a.label}">${icon(a.icon)}<span class="tb__label">${a.label}</span></button>`;
    }).join('')}</div>`;
  }).join('');
  const figs = m.figs.map(([k, v, cls]) => `<div class="fig"><span>${k}</span><b class="${cls || ''}">${v}</b></div>`).join('');
  return `
    <div class="botbar__row">
      <a class="crumb" href="#">← Home</a>
      <h1 class="botname">spy-ema-20260930-1430</h1>
      <span class="botmeta">EMA crossover · <b>SPY</b> · 1 share</span>
      <span class="status status--${m.status[0]}">${m.status[1]}</span>
      ${m.example ? '<span class="example-flag">Example: made-up manual buy</span>' : ''}
      <div class="figs">${figs}</div>
    </div>
    <div class="botbar__row"><p class="summary">${m.summary}</p></div>
    <div class="toolbar" role="toolbar" aria-label="Actions for this bot">${tb}
      ${m.fresh ? `<span class="toolbar__fresh"><i></i>${m.fresh}</span>` : ''}
    </div>`;
}

const panel = (title, sub, body, cls = '') =>

function chartPanel(m, lanes) {
  const strat = state.view === 'strategy';
  const g = gate();
  const src = strat ? 'Bot’s decision bars' : m.now ? 'IBKR live' : 'Polygon · loaded for this run';
  const legend = strat
    ? `<span class="src">${src} ·</span><span><i class="sw" style="background:var(--up-bright)"></i><i class="sw" style="background:var(--down-bright)"></i> gate holds</span>
       <span><i class="sw" style="background:var(--up-dark);box-shadow:inset 0 0 0 1px var(--up-dark-edge)"></i><i class="sw" style="background:var(--down-dark);box-shadow:inset 0 0 0 1px var(--down-dark-edge)"></i> gate fails</span>
       <span><i class="ln" style="background:var(--ema-fast)"></i>EMA 5</span>
       <span><i class="ln" style="background:var(--ema-slow)"></i>EMA 10</span>
       <span><i class="ln" style="background:var(--rsi)"></i>RSI 14</span>
       <span>○ decision</span>

    : `<span class="src">${src} ·</span><span><i class="sw" style="background:var(--bull)"></i><i class="sw" style="background:var(--bear)"></i> 1-min candles</span>

        <button type="button" class="chipbtn" data-pop="ind" aria-haspopup="true">${icon('plus')}Indicators</button>` : ''}
    </header>
    <div class="legend">${legend}</div>
    <div class="panel__body"><div class="chart-host" data-lanes="${lanes ? 1 : 0}"></div></div>

}

function moneyBody(m) {
  return `<div class="hero"><b>${m.money.hero[0]}</b><span>${m.money.hero[1]}</span></div>
    <dl class="kv">${m.money.rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

function decisionsBody(m) {
  const rows = [];
  let started = false;
  for (const r of m.decisions) {
    if (!r.before && !started) { rows.push(`<li class="startline">Bot started ${hm(T.runStart)}</li>`); started = true; }
    const open = state.open.includes(r.ts), sel = state.sel === r.ts;
    rows.push(`<li class="drow${r.before ? ' before' : ''}${sel ? ' sel' : ''}" data-dts="${r.ts}" aria-expanded="${open}"><time>${hm(r.ts)}</time><span class="what">${r.before ? 'Before start · not acted on' : 'No action'}</span>${chips(r)}${open ? checksTable(r) : ''}</li>`);
  }
  if (m.st === 'running') rows.push(`<li class="next"><time>14:30</time><span class="what">Next decision</span><span class="why">When the 14:30 bar closes</span></li>`);
  const fills = m.fills.length
    ? `<ul class="orders">${m.fills.map(([t, w, p]) => `<li><span>${w}</span><span class="m">${usd(p)} · ${hms(t)}</span></li>`).join('')}</ul>`
    : `<p class="note">No fills in this run.</p>`;
  return `<ul class="dlist">${rows.join('')}</ul><p class="sect">Fills · Wed Sep 30</p>${fills}`;
}

function healthBody(m) {
  const li = r => `<li><span class="dot dot--${r[0]}"></span><span>${r[1]}</span><span class="val">${r[2]}</span>${r[3] ? `<span class="why">${r[3]}</span>` : ''}</li>`;
  const run = m.healthRun ? `<p class="sect">During this run</p><ul class="health">${m.healthRun.map(li).join('')}</ul>` : '';
  return `${run}<p class="sect">${m.st === 'running' ? 'Right now' : 'Account right now'}</p><ul class="health">${m.healthNow.map(li).join('')}</ul>`;
}

function proofRows(m) {

}
function setupBody(m) {

function ordersBody(m) {
  const working = m.working.length
    ? `<ul class="orders">${m.working.map(([w, s]) => `<li><span>${w}</span><span class="m">${s}</span></li>`).join('')}</ul>`
    : `<p class="note">No working orders.</p>`;
  const path = m.path
    ? `<p class="sect">Exit order path</p><div class="path">${['Signal', 'Intent', 'Submit gate', 'Broker ack', 'Fill', 'Reconciled'].map((s, i) => `<span class="${m.path[i]}">${s}</span>`).join('')}</div>`
    : '';
  const audit = `<ul class="dlist">${m.audit.map(([t, w]) => `<li><time>${hm(t)}</time><span>${w}</span></li>`).join('')}</ul>`;
  return `<div class="cols2"><div><p class="sect">Working orders</p>${working}${path}</div><div><p class="sect">Audit trail</p>${audit}</div></div>`;
}

function feedBody(m) {
  const ev = [];
  for (const d of m.decisions) ev.push([d.ts, 'dec', d.before ? 'Last bar before start · not acted on' : 'No action', chips(d)]);
  ev.push([T.registered, 'life', 'Deployed', '$800 set aside']);
  ev.push([T.launched, 'life', 'Started', '']);
  ev.push([T.partial, 'data', 'Joined market data mid-minute', 'Skipped the partial 13:31 minute']);
  for (const [t, w, p] of m.fills) ev.push([t, 'buy', `Filled: ${w}`, `at ${usd(p)}`]);
  if (m.st === 'finished') { ev.push([T.stopped, 'life', 'Stopped at its scheduled end', 'Nothing to sell']); ev.push([T.runEnd, 'money', '$800 back to the account', '']); }
  if (m.st === 'holding') ev.push([T.stopped, 'life', 'Stopped at its scheduled end', 'Kept 1 SPY; exit order queued for Thu 08:30 CT']);
  ev.sort((a, b) => a[0] - b[0]);
  const rows = ev.map(([t, k, w, why]) => `<li><time>${hm(t)}</time><span class="mk mk--${k}"></span><span>${w}</span>${why ? `<span class="why">${why}</span>` : ''}</li>`);
  if (m.st === 'running') rows.push(`<li class="next"><time>14:30</time><span class="mk"></span><span>Next decision</span></li><li class="next"><time>14:59</time><span class="mk"></span><span>Scheduled end · sell at market</span></li>`);
  return `<ul class="feed">${rows.join('')}</ul>`;
}

// ── Chart drawing ─────────────────────────────────────────────────────
function drawLanes(s, X, m, y0, laneH, left, plotW, lim) {
  const rEnd = Math.min(T.runEnd, lim);
  ['Decisions', 'Orders', 'Market data', 'Bot'].forEach((name, i) => {
    const y = y0 + i * laneH, cy = y + laneH / 2;
    s.push(`<line x1="${left}" x2="${left + plotW}" y1="${y + laneH}" y2="${y + laneH}" stroke="var(--line)"/>`);
    s.push(`<text class="svg-t2" x="${left + 2}" y="${cy + 3}">${name}</text>`);
    if (name === 'Decisions') {
      for (const d of m.decisions.filter(d => !d.before)) s.push(`<circle cx="${X(d.ts)}" cy="${cy}" r="3.5" fill="none" stroke="var(--fg-2)" stroke-width="1.4"><title>${hm(d.ts)} No action</title></circle>`);
      if (m.now) s.push(`<circle cx="${X(T.formingClose)}" cy="${cy}" r="3.5" fill="none" stroke="var(--fg-4)" stroke-dasharray="2 2"><title>Next decision 14:30</title></circle>`);
    }
    if (name === 'Orders') {
      for (const [t] of m.fills) s.push(`<path d="M${X(t)} ${cy - 5} l5 9 h-10 z" fill="var(--bull)"><title>Manual buy filled ${hms(t)}</title></path>`);
      if (m.working.length) s.push(`<rect x="${X(T.runEnd) - 5}" y="${cy - 5}" width="10" height="10" fill="none" stroke="var(--warn)" stroke-width="1.5" transform="rotate(45 ${X(T.runEnd)} ${cy})"><title>Exit order waiting for the open</title></rect>`);
      if (!m.fills.length && !m.working.length) s.push(`<text class="svg-t" x="${X(T.runStart) + 6}" y="${cy + 3}">none</text>`);
    }
    if (name === 'Market data') {
      s.push(`<rect x="${X(T.runStart)}" y="${cy - 3}" width="${Math.max(0, X(rEnd) - X(T.runStart))}" height="6" rx="3" fill="var(--bull)" fill-opacity="0.55"><title>IBKR continuous during this run</title></rect>`);
      s.push(`<rect x="${X(T.partial) - 1.5}" y="${cy - 6}" width="3" height="12" fill="var(--warn)"><title>13:31 partial first minute skipped</title></rect>`);
    }
    if (name === 'Bot') {
      s.push(`<path d="M${X(T.runStart)} ${cy - 5} l8 5 l-8 5 z" fill="var(--accent-text)"><title>Started ${hms(T.runStart)}</title></path>`);
      s.push(m.now
        ? `<rect x="${X(T.schedEnd) - 5}" y="${cy - 5}" width="10" height="10" fill="none" stroke="var(--accent-text)" stroke-dasharray="2 2"><title>Scheduled end ${hm(T.schedEnd)}</title></rect>`
        : `<rect x="${X(T.runEnd) - 5}" y="${cy - 5}" width="10" height="10" fill="var(--accent-text)"><title>Stopped ${hms(T.runEnd)}</title></rect>`);
    }
  });
}

function priceTag(s, x, y, w, v, col) {
  s.push(`<rect x="${x}" y="${y - 8}" width="${w}" height="16" rx="2" fill="${col}"/>`);
  s.push(`<text x="${x + 5}" y="${y + 3.5}" style="font:600 10px var(--font-mono);fill:#04120f">${v.toFixed(2)}</text>`);
}

function strategySVG(w, h, m, withLanes) {
  const nL = withLanes ? 4 : 0, laneH = 16, axisH = 18, top = 6, right = 54, left = 8, gp = 10;
  const lanesH = nL ? nL * laneH + 6 : 0;
  const avail = Math.max(150, h - top - axisH - lanesH - gp);
  const priceH = Math.round(avail * 0.7), rsiH = avail - priceH;
  const plotW = Math.max(120, w - left - right);
  const X = t => left + (t - T.sessStart) / (T.sessEnd - T.sessStart) * plotW;
  const slot = plotW / S.length, cw = Math.max(2, slot * 0.62);
  const lim = m.now ?? Infinity;
  const rows = S.filter(r => r.ts <= lim);
  let lo = Math.min(...S.map(r => Math.min(r.l, r.e5, r.e10)));
  let hi = Math.max(...S.map(r => Math.max(r.h, r.e5, r.e10)));
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const Y = p => top + (hi - p) / (hi - lo) * priceH;
  const rTop = top + priceH + gp, bottom = rTop + rsiH, full = bottom + lanesH;
  const R = v => rTop + (80 - Math.max(20, Math.min(80, v))) / 60 * rsiH;
  const g = gate();
  const s = [];
  // before start / after end
  const xs = X(T.runStart);
  s.push(`<rect x="${left}" y="${top}" width="${xs - left}" height="${bottom - top}" fill="var(--sunken)" fill-opacity="0.5"/>`);
  s.push(`<text class="svg-t2" x="${left + 4}" y="${top + 12}">Before start · not acted on</text>`);
  if (!m.now) s.push(`<rect x="${X(T.runEnd)}" y="${top}" width="${left + plotW - X(T.runEnd)}" height="${bottom - top}" fill="var(--sunken)" fill-opacity="0.5"/>`);
  // price grid + axis
  for (let p = Math.ceil(lo); p <= hi; p += 1) {
    s.push(`<line x1="${left}" x2="${left + plotW}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/>`);
    s.push(`<text class="svg-t" x="${left + plotW + 6}" y="${Y(p) + 3}">${p}</text>`);
  }
  for (let t = T.sessStart + 30 * MIN; t <= T.sessEnd; t += 60 * MIN) {
    s.push(`<line x1="${X(t)}" x2="${X(t)}" y1="${top}" y2="${full}" stroke="var(--line)"/>`);
    s.push(`<text class="svg-t" x="${X(t)}" y="${full + 13}" text-anchor="${t === T.sessEnd ? 'end' : 'middle'}">${hm(t)}</text>`);
  }
  // RSI pane with the strategy's band
  s.push(`<rect x="${left}" y="${R(70)}" width="${plotW}" height="${R(50) - R(70)}" fill="var(--rsi)" fill-opacity="0.07"/>`);
  for (const v of [70, 50]) {
    s.push(`<line x1="${left}" x2="${left + plotW}" y1="${R(v)}" y2="${R(v)}" stroke="var(--rsi)" stroke-opacity="0.45" stroke-dasharray="3 3"/>`);
    s.push(`<text class="svg-t" x="${left + plotW + 6}" y="${R(v) + 3}">${v}</text>`);
  }
  s.push(`<line x1="${left}" x2="${left + plotW}" y1="${rTop - gp / 2}" y2="${rTop - gp / 2}" stroke="var(--line-2)"/>`);
  s.push(`<text class="svg-t2" x="${left + 4}" y="${rTop + 10}">RSI 14 · band ${SETTINGS.rsi_min}–${SETTINGS.rsi_max}</text>`);
  s.push(`<polyline fill="none" stroke="var(--rsi)" stroke-width="1.5" points="${rows.map(r => `${X(center(r))},${R(r.rsi)}`).join(' ')}"/>`);
  // candles shaded by the Dark Bright Gate
  for (const r of rows) {
    const cx = X(center(r)), up = r.c >= r.o, on = g.test(r);
    const fill = up ? (on ? 'var(--up-bright)' : 'var(--up-dark)') : (on ? 'var(--down-bright)' : 'var(--down-dark)');
    const edge = up ? (on ? 'var(--up-bright)' : 'var(--up-dark-edge)') : (on ? 'var(--down-bright)' : 'var(--down-dark-edge)');
    const y1 = Y(Math.max(r.o, r.c)), y2 = Y(Math.min(r.o, r.c));
    const sel = state.sel === r.ts;
    s.push(`<g class="cndl" data-ts="${r.ts}" style="cursor:pointer">
      <rect x="${cx - slot / 2}" y="${top}" width="${slot}" height="${bottom - top}" fill="${sel ? 'var(--accent-faint)' : 'transparent'}" ${sel ? 'stroke="var(--accent-text)" stroke-opacity="0.5"' : ''}/>
      <line x1="${cx}" x2="${cx}" y1="${Y(r.h)}" y2="${Y(r.l)}" stroke="${edge}"/>
      <rect x="${cx - cw / 2}" y="${y1}" width="${cw}" height="${Math.max(1.5, y2 - y1)}" fill="${fill}" stroke="${edge}"/>
      <title>${hm(r.ts)} bar · ${phaseOf(r)} · gate ${on ? 'holds' : 'fails'}</title></g>`);
  }
  // forming candle while running
  if (m.now) {
    const fb = DATA.bars.filter(b => b[0] >= T.formingFrom && b[0] < m.now);
    const o = fb[0][1], c = fb.at(-1)[4], hh = Math.max(...fb.map(b => b[2])), l = Math.min(...fb.map(b => b[3]));
    const cx = X(T.formingClose - 7.5 * MIN);
    s.push(`<line x1="${cx}" x2="${cx}" y1="${Y(hh)}" y2="${Y(l)}" stroke="var(--fg-3)" stroke-dasharray="2 2"/>`);
    s.push(`<rect x="${cx - cw / 2}" y="${Y(Math.max(o, c))}" width="${cw}" height="${Math.max(1.5, Math.abs(Y(o) - Y(c)))}" fill="none" stroke="var(--fg-3)" stroke-dasharray="2 2"><title>14:30 bar, still forming</title></rect>`);
    s.push(`<text class="svg-t2" x="${cx}" y="${Y(hh) - 6}" text-anchor="middle">forming</text>`);
  }
  // strategy lines from the bot's own values
  const pl = (k, col) => `<polyline fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" points="${rows.map(r => `${X(center(r))},${Y(r[k])}`).join(' ')}"/>`;
  s.push(pl('e5', 'var(--ema-fast)'), pl('e10', 'var(--ema-slow)'));
  // decisions and fills
  for (const d of m.decisions.filter(d => !d.before)) s.push(`<circle cx="${X(center(d))}" cy="${Y(d.h) - 8}" r="3.5" fill="var(--surface)" stroke="var(--fg-2)" stroke-width="1.5" pointer-events="none"/>`);
  for (const [t, , p] of m.fills) s.push(`<path d="M${X(t)} ${Y(p) + 2} l5 8 h-10 z" fill="var(--bull)" stroke="var(--canvas)" pointer-events="none"><title>Manual buy ${usd(p)}</title></path>`);
  // run boundaries
  s.push(`<line x1="${xs}" x2="${xs}" y1="${top}" y2="${full}" stroke="var(--accent-text)" stroke-width="1.5"/>`);
  s.push(`<text class="svg-tb" x="${xs + 4}" y="${top + 12}" style="fill:var(--accent-text)">Bot started ${hm(T.runStart)}</text>`);
  const xe = X(T.runEnd);
  s.push(`<line x1="${xe}" x2="${xe}" y1="${top}" y2="${full}" stroke="var(--accent-text)" stroke-opacity="0.7" stroke-dasharray="${m.now ? '6 4' : '3 3'}"/>`);
  s.push(`<text class="svg-t2" x="${xe - 4}" y="${top + 25}" text-anchor="end">${m.now ? 'Ends' : 'Ended'} ${hm(T.schedEnd)}</text>`);
  if (m.now) {
    s.push(`<line x1="${X(m.now)}" x2="${X(m.now)}" y1="${top}" y2="${full}" stroke="var(--fg-2)" stroke-dasharray="3 3"/>`);
    s.push(`<text class="svg-tb" x="${X(m.now) + 4}" y="${bottom - 4}">now ${hm(m.now)}</text>`);
  }
  const lastC = m.now ? lastBarBefore(m.now)[4] : rows.at(-1).c;
  priceTag(s, left + plotW + 1, Y(lastC), right - 2, lastC, 'var(--bull)');
  if (nL) drawLanes(s, X, m, bottom + 6, laneH, left, plotW, lim);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Strategy view: 15-minute decision candles shaded by the ${g.name} gate, with EMA 5, EMA 10 and RSI">${s.join('')}</svg>`;
}

function tapeSVG(w, h, m, withLanes) {
  const nL = withLanes ? 4 : 0, laneH = 16, axisH = 18, top = 6, right = 54, left = 8;
  const lanesH = nL ? nL * laneH + 6 : 0;
  const plotH = Math.max(80, h - top - axisH - lanesH - 4);
  const plotW = Math.max(120, w - left - right);
  const X = t => left + (t - T.winStart) / (T.winEnd - T.winStart) * plotW;
  const lim = m.now ?? Infinity;
  const all = DATA.bars;
  let lo = Math.min(...all.map(b => b[3])), hi = Math.max(...all.map(b => b[2]));
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const Y = p => top + (hi - p) / (hi - lo) * plotH;
  const full = top + plotH + lanesH;
  const s = [];
  const rEnd = Math.min(T.runEnd, lim);
  s.push(`<rect x="${X(T.runStart)}" y="${top}" width="${X(rEnd) - X(T.runStart)}" height="${plotH}" fill="var(--accent-faint)"/>`);
  for (let p = Math.ceil(lo); p <= hi; p += 1) {
    s.push(`<line x1="${left}" x2="${left + plotW}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/>`);
    s.push(`<text class="svg-t" x="${left + plotW + 6}" y="${Y(p) + 3}">${p}</text>`);
  }
  for (let t = T.winStart; t <= T.winEnd; t += 15 * MIN) {
    s.push(`<line x1="${X(t)}" x2="${X(t)}" y1="${top}" y2="${full}" stroke="var(--line)"/>`);
    s.push(`<text class="svg-t" x="${X(t)}" y="${full + 13}" text-anchor="${t === T.winStart ? 'start' : t === T.winEnd ? 'end' : 'middle'}">${hm(t)}</text>`);
  }
  const cw = Math.max(1, plotW / all.length * 0.62);
  const vis = all.filter(b => b[0] < lim);
  for (const [ts, o, hh, l, c] of vis) {
    const x = X(ts + MIN / 2), col = c >= o ? 'var(--bull)' : 'var(--bear)';
    s.push(`<line x1="${x}" x2="${x}" y1="${Y(hh)}" y2="${Y(l)}" stroke="${col}"/>`);
    s.push(`<rect x="${x - cw / 2}" y="${Y(Math.max(o, c))}" width="${cw}" height="${Math.max(1, Y(Math.min(o, c)) - Y(Math.max(o, c)))}" fill="${col}"/>`);
  }
  for (const d of m.decisions.filter(d => !d.before)) s.push(`<circle cx="${X(d.ts)}" cy="${Y(d.c)}" r="4" fill="var(--surface)" stroke="var(--fg-2)" stroke-width="1.5"><title>${hm(d.ts)} No action</title></circle>`);
  for (const [t, , p] of m.fills) s.push(`<path d="M${X(t)} ${Y(p) + 3} l5 8 h-10 z" fill="var(--bull)" stroke="var(--canvas)"><title>Manual buy ${usd(p)}</title></path>`);
  s.push(`<line x1="${X(T.runStart)}" x2="${X(T.runStart)}" y1="${top}" y2="${full}" stroke="var(--accent-text)" stroke-width="1.5"/>`);
  s.push(`<text class="svg-tb" x="${X(T.runStart) + 4}" y="${top + 12}" style="fill:var(--accent-text)">Bot started ${hm(T.runStart)}</text>`);
  s.push(`<line x1="${X(T.runEnd)}" x2="${X(T.runEnd)}" y1="${top}" y2="${full}" stroke="var(--accent-text)" stroke-opacity="0.7" stroke-dasharray="${m.now ? '6 4' : '3 3'}"/>`);
  s.push(`<text class="svg-t2" x="${X(T.runEnd) - 4}" y="${top + 12}" text-anchor="end">${m.now ? 'Ends' : 'Ended'} ${hm(T.schedEnd)}</text>`);
  if (m.now) {
    s.push(`<line x1="${X(m.now)}" x2="${X(m.now)}" y1="${top}" y2="${full}" stroke="var(--fg-2)" stroke-dasharray="3 3"/>`);
    s.push(`<text class="svg-tb" x="${X(m.now) + 4}" y="${top + plotH - 4}">now ${hm(m.now)}</text>`);
  }
  if (vis.length) priceTag(s, left + plotW + 1, Y(vis.at(-1)[4]), right - 2, vis.at(-1)[4], 'var(--bull)');
  if (nL) drawLanes(s, X, m, top + plotH + 6, laneH, left, plotW, lim);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="SPY one-minute candles for this run">${s.join('')}</svg>`;
}

// ── Popovers ──────────────────────────────────────────────────────────
function explainHTML(r) {
  const g = gate(), on = g.test(r);
  return `<h3>${hm(r.ts)} bar · ${phaseOf(r)}</h3>
    <p class="vals" style="margin:-4px 0 6px">O ${r.o.toFixed(2)} · H ${r.h.toFixed(2)} · L ${r.l.toFixed(2)} · C ${r.c.toFixed(2)}</p>
    ${checksTable(r)}
    <p class="note" style="margin-top:8px">Gate “${g.name}”: <b class="${on ? 'ok' : 'no'}">${on ? 'holds, bright candle' : 'fails, dark candle'}</b></p>`;
}
function gateHTML(withEditor) {
  return `<h3>Dark Bright Gate</h3>
    <p class="note" style="margin:-4px 0 8px">Shades the strategy candles: bright where the gate holds, dark where it fails. One gate at a time. Gates only shade; they never trade.</p>
    <ul class="gl" role="menu">${GATES.map(g => `<li><button type="button" role="menuitemradio" aria-checked="${g.id === state.gate}" data-gate="${g.id}"><span class="radio"></span><span>${g.name}</span><span class="own${g.owner === 'strategy' ? ' own--strategy' : ''}">${g.owner === 'strategy' ? 'strategy’s rule' : 'mine'}</span><code>${g.expr}</code></button></li>`).join('')}</ul>
    ${withEditor ? `<div class="editor">
      <label class="note" for="gexpr">One linear expression, tested against zero</label>
      <div class="row"><input id="gexpr" value="EMA5 − EMA10 − gap" style="flex:1"><select id="gsign" aria-label="Test"><option>&gt; 0</option><option>&lt; 0</option></select></div>
      <div class="vars"><span>EMA5</span><span>EMA10</span><span>RSI14</span><span>open</span><span>close</span><span>volume</span><span>gap</span><span>rsi_min</span><span>rsi_max</span><span class="cc">VWAP · chart-computed</span><span class="cc">EMA20 · chart-computed</span></div>
      <p class="note">The bot’s own values win over chart-computed ones. Settings like <code>gap</code> follow each bot’s deployed value.</p>
      <div class="row"><input id="gname" placeholder="Name this gate" style="flex:1;font-family:var(--font-sans)"><button type="button" class="btn-primary" data-savegate>Save on strategy</button></div>
    </div>` : `<button type="button" class="btn-ghost" data-newgate style="margin-top:8px">+ New gate</button>`}`;
}
function indHTML() {
  return `<h3>Indicators</h3>
    <p class="x-sub">Strategy’s own · bot’s values</p>
    <ul class="il"><li><span>EMA 5</span><span class="lock">always on</span></li><li><span>EMA 10</span><span class="lock">always on</span></li><li><span>RSI 14 · 50–70 band</span><span class="lock">always on</span></li></ul>
    <p class="x-sub">More · computed by the chart on the 15-min candles</p>
    <input class="search" id="indq" type="search" placeholder="Search indicators" autocomplete="off" aria-label="Search indicators">
    <ul class="il" id="indlist">${CATALOG.map(n => `<li data-name="${n.toLowerCase()}"><button type="button" data-addind="${n}">${n}</button><span class="tagc">chart-computed</span></li>`).join('')}</ul>`;
}
function allActionsHTML(m) {
  const on = new Set(m.actions.filter(a => a !== '|'));
  return `<h3>All actions for this bot</h3><ul class="alist">${Object.keys(ACTIONS).filter(id => id !== 'all').map(id => {
    const a = ACTIONS[id], avail = on.has(id);
    return `<li>${icon(a.icon)}<span>${a.label} <span class="sys">${a.sys}</span></span><span class="st ${avail ? 'st--on' : 'st--off'}">${avail ? 'Available' : 'Not needed'}</span><span class="r">${avail ? a.tip : (m.off[id] || a.tip)}</span></li>`;
  }).join('')}</ul>`;
}

// ── State, render, wiring ─────────────────────────────────────────────
const state = { v: 0, st: 'finished', itab: 'Decisions', view: 'strategy', gate: 'rule', sel: null, open: [] };
try { Object.assign(state, JSON.parse(localStorage.getItem('botmock2') || '{}')); } catch (e) { /* storage unavailable: defaults */ }
const save = () => { try { localStorage.setItem('botmock2', JSON.stringify(state)); } catch (e) { /* storage unavailable */ } };

const ro = new ResizeObserver(entries => { for (const e of entries) drawChart(e.target); });
function drawChart(host) {
  const r = host.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const draw = state.view === 'strategy' ? strategySVG : tapeSVG;
  host.innerHTML = draw(Math.floor(r.width), Math.floor(r.height), model(state.st), host.dataset.lanes === '1');
}

function render() {
  const m = model(state.st);
  const v = VARIANTS[state.v];
  document.getElementById('botbar').innerHTML = banner(m);
  document.getElementById('board').innerHTML = v.render(m);
  document.getElementById('vlabel').textContent = `${v.key} · ${v.name}`;
  document.querySelectorAll('.proto [data-state]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.state === state.st)));
  ro.disconnect();
  document.querySelectorAll('.chart-host').forEach(h => { drawChart(h); ro.observe(h); });
  if (window.lucide) window.lucide.createIcons();
  else document.body.classList.add('labels');
  save();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 3200);
}
function place(p, x, y) {
  p.style.top = `${Math.max(16, Math.min(y, window.innerHeight - p.offsetHeight - 16))}px`;
  p.style.left = `${Math.max(16, Math.min(x, window.innerWidth - p.offsetWidth - 16))}px`;
}
function openPop(anchor, html) {
  const p = document.getElementById('pop');
  p.innerHTML = html; p.hidden = false;
  const r = anchor.getBoundingClientRect();
  place(p, r.left, r.bottom + 8);
  if (window.lucide) window.lucide.createIcons();
}
function openPopAt(x, y, html) {
  const p = document.getElementById('pop');
  p.innerHTML = html; p.hidden = false;
  place(p, x + 14, y - 20);
}

const ACT_TOASTS = {
  stop: 'Opens a confirm: “Stop new decisions? Shares stay held.”',
  sell: 'Opens the sale ticket: step 1 shows the plan, step 2 sends it.',
  end: 'Opens the end editor.',
  again: 'Opens Deploy, filled in from this bot.',
  clear: 'Moves this bot off Home. Records stay in History.',
  manual: 'Opens a manual order on SPY.',
  check: 'Runs a fresh comparison with Alpaca and shows the result here.',
  cancel: 'Opens a confirm listing the 1 open order it would cancel.',
  timeline: 'Opens the custody timeline (read-only).',
};

document.addEventListener('click', e => {
  const pop = document.getElementById('pop');
  const t = e.target;
  const act = t.closest('[data-act]');
  if (act) {
    const id = act.dataset.act, m = model(state.st);
    if (id === 'all') return openPop(act, allActionsHTML(m));
    if (id === 'proof') return openPop(act, `<h3>Build proof <span class="proven" style="font-size:var(--fs-sm)">· proven at start</span></h3><p class="note" style="margin-bottom:8px">The program this run used matches its qualification receipt. Checked Sep 30 ${hms(T.runStart)} CT.</p>${proofRows(m)}`);
    pop.hidden = true;
    return toast(`Mockup: ${ACT_TOASTS[id] || ACTIONS[id].label}`);
  }
  const cp = t.closest('[data-copy]');
  if (cp) {
    const v = cp.dataset.copy;
    Promise.resolve().then(() => navigator.clipboard.writeText(v)).then(() => toast('Copied'), () => toast(v));
    return;
  }
  const pb = t.closest('[data-pop]');
  if (pb) return openPop(pb, pb.dataset.pop === 'gate' ? gateHTML(false) : indHTML());
  const gb = t.closest('[data-gate]');
  if (gb) { state.gate = gb.dataset.gate; pop.hidden = true; render(); return; }
  if (t.closest('[data-newgate]')) { pop.innerHTML = gateHTML(true); return; }
  if (t.closest('[data-savegate]')) { pop.hidden = true; return toast('Mockup: saves the gate on EMA Crossover Signal, for every bot that runs it and Strategy Lab.'); }
  const ai = t.closest('[data-addind]');
  if (ai) { pop.hidden = true; return toast(`Mockup: adds ${ai.dataset.addind} to the strategy view, marked chart-computed.`); }
  const vb = t.closest('[data-view]');
  if (vb) { state.view = vb.dataset.view; pop.hidden = true; return render(); }
  const cn = t.closest('.cndl');
  if (cn) {
    state.sel = +cn.dataset.ts;
    render();
    return openPopAt(e.clientX, e.clientY, explainHTML(S.find(r => r.ts === state.sel)));
  }
  const dr = t.closest('[data-dts]');
  if (dr) {
    const ts = +dr.dataset.dts;
    state.open = state.open.includes(ts) ? state.open.filter(x => x !== ts) : [...state.open, ts];
    state.sel = ts; pop.hidden = true;
    return render();
  }
  const it = t.closest('[data-itab]');
  if (it) { state.itab = it.dataset.itab; return render(); }
  const sb = t.closest('.proto [data-state]');
  if (sb) { state.st = sb.dataset.state; state.sel = null; pop.hidden = true; return render(); }
  if (!pop.hidden && !t.closest('#pop')) pop.hidden = true;
});
document.addEventListener('input', e => {
  if (e.target.id !== 'indq') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#indlist li').forEach(li => { li.hidden = !li.dataset.name.includes(q); });
});
const step = d => { state.v = (state.v + d + VARIANTS.length) % VARIANTS.length; document.getElementById('pop').hidden = true; render(); };
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.getElementById('pop').hidden = true; document.getElementById('notes').hidden = true; document.getElementById('notesBtn').setAttribute('aria-pressed', 'false'); return; }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.getElementById('labels').addEventListener('click', e => {
  const on = document.body.classList.toggle('labels');
  e.currentTarget.setAttribute('aria-pressed', String(on));
});
document.getElementById('notesBtn').addEventListener('click', e => {
  const n = document.getElementById('notes');
  n.hidden = !n.hidden;
  e.currentTarget.setAttribute('aria-pressed', String(!n.hidden));
});

document.getElementById('notes').innerHTML = `
