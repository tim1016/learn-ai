name: Daily Full Tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-full-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-full:
    name: Backend Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore podman.sln
      - name: Run the complete backend suite
        env:
          BACKEND_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
          DOTNET_NOLOGO: true
        run: |
          mkdir -p TestResults
          dotnet test Backend.Tests/Backend.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=backend-full.trx" --results-directory TestResults
      - name: Upload backend test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-backend-test-results
          path: TestResults/backend-full.trx
          if-no-files-found: ignore

  python-full:
    name: Python Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATA_PLANE_CONTROL_SECRET: ""
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL_IS_EPHEMERAL: "1"
    defaults:
      run:
        working-directory: PythonDataService
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Migrate the data-lake schema
        working-directory: ${{ github.workspace }}
        env:
          DOTNET_NOLOGO: true
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet build Backend/Backend.csproj
          dotnet ef database update --project Backend/Backend.csproj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonDataService/requirements*.txt
      - run: pip install -r requirements-heavy.txt -r requirements-light.txt -r requirements-dev.txt
      - name: Run the complete non-data-lake suite
        run: |
          mkdir -p TestResults
          python -m pytest tests app/engine/tests \
            --ignore=tests/unit/data_lake \
            --ignore=tests/integration/data_lake \
            -q --tb=short \
            --junitxml=TestResults/python-full.xml
      - name: Run PostgreSQL-backed data-lake tests serially
        run: |
          python -m pytest tests/unit/data_lake tests/integration/data_lake \
            -q --tb=short \
            --junitxml=TestResults/python-data-lake.xml
      - name: Upload Python test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-python-test-results
          path: PythonDataService/TestResults/*.xml
          if-no-files-found: ignore

  fleet-compose-qualification:
    name: Fleet Compose Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PythonDataService
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docker compose version
        run: docker compose version
      - name: Run the isolated actual-role Compose qualification
        env:
          DATA_PLANE_CONTROL_SECRET: ""
        run: |
          mkdir -p TestResults
          # The runner has no deploy/fleet/env/*.env, so the pre-ceremony render
          # is already secret-free; pin it anyway so the job cannot regress.
          # Compose resolves a relative env_file against the Compose file's
          # parent (repo root), not this step's working-directory, so the
          # pin must be absolute or it silently misses.
          : > TestResults/empty.env
          # A cold runner building python:3.12-slim + requirements-heavy takes
          # minutes; --build-timeout-s widens only that one bound so the first
          # nightly run doesn't go red on image build alone.
          FLEET_LIVE_ENV_FILE="$(pwd)/TestResults/empty.env" \
          FLEET_PAPER_ENV_FILE="$(pwd)/TestResults/empty.env" \
          FLEET_COORDINATOR_ENV_FILE="$(pwd)/TestResults/empty.env" \
          python -m scripts.run_broker_fleet_compose_qualification \
            --timeout-s 120 --build-timeout-s 1500 \
            --evidence-path TestResults/fleet-compose-qualification.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-compose-qualification
          path: PythonDataService/TestResults/fleet-compose-qualification.json
          if-no-files-found: warn
