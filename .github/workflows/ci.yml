name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  temporal-authority-guard:
    name: Temporal Authority Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_temporal_authority.py

  adr-status-guard:
    name: ADR Status Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_adr_status.py
      - run: timeout --signal=KILL 120s python scripts/test_check_adr_status.py -v

  fleet-tooling-tests:
    name: Fleet Tooling Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --config PythonDataService/ruff.toml scripts/dev/fleet/
      - run: timeout --signal=KILL 120s python scripts/dev/fleet/test_fleet_tooling.py -v

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run codegen:check
      - run: npx tsc --noEmit

  frontend-test-shard:
    name: Frontend Test Shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: Frontend
    env:
      NG_BUILD_MAX_WORKERS: "2"
      TEST_SHARD_COUNT: "3"
      TEST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --runner-config=vitest.ci.config.ts

  frontend-test:
    name: Frontend Tests
    if: ${{ always() }}
    needs: frontend-test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every frontend shard to pass
        if: ${{ needs.frontend-test-shard.result != 'success' }}
        run: exit 1

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore podman.sln
      - run: dotnet format podman.sln --verify-no-changes --no-restore

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore podman.sln
      - run: dotnet build podman.sln --no-restore --configuration Release
        env:
          DOTNET_NOLOGO: true

  backend-graphql-contract:
    name: Backend GraphQL Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Backend/Backend.csproj
      - name: Export GraphQL schema and require a committed snapshot
        run: |
          dotnet run --project Backend --configuration Release -- schema export --output ../contracts/graphql/backend.schema.graphql
          git diff --exit-code -- contracts/graphql/backend.schema.graphql

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore podman.sln
      - name: Run Backend Tests
        env:
          DOTNET_NOLOGO: true
        run: |
          timeout --signal=KILL 120s dotnet test Backend.Tests/Backend.Tests.csproj --no-restore --configuration Release --filter "Category!=PostgresIntegration" --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
      - name: Upload backend test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/backend-tests.trx
          if-no-files-found: ignore

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonDataService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/

  broker-v2-operator-manual-contract:
    name: Broker V2 Operator Manual Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonDataService
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonDataService/requirements*.txt
      - run: pip install -r requirements-heavy.txt -r requirements-light.txt -r requirements-dev.txt
      - name: Regenerate the manual and require it to match both committed copies
        run: |
          python -m scripts.regenerate_broker_v2_operator_manual
          cd ..
          git diff --exit-code -- \
            docs/broker-v2-operator-manual.md \
            Frontend/src/assets/docs/broker-v2-operator-manual.md

  broker-v2-vocabulary-contract:
    name: Broker V2 Vocabulary Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonDataService
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonDataService/requirements*.txt
      - run: pip install -r requirements-heavy.txt -r requirements-light.txt -r requirements-dev.txt
      - name: Regenerate the vocabulary snapshot and require it to match both committed copies
        run: |
          python -m scripts.regenerate_broker_v2_vocabulary_snapshot
          cd ..
          git diff --exit-code -- \
            PythonDataService/app/broker/v2panel/vocabulary.snapshot.json \
            Frontend/src/app/components/broker/v2-panel/lib/broker-v2-vocabulary.snapshot.json
          # `git diff` ignores untracked files, so a snapshot that got deleted
          # and regenerated as a new, never-committed file would pass the
          # check above unnoticed. `git status --porcelain` catches that.
          status=$(git status --porcelain -- \
            PythonDataService/app/broker/v2panel/vocabulary.snapshot.json \
            Frontend/src/app/components/broker/v2-panel/lib/broker-v2-vocabulary.snapshot.json)
          if [ -n "$status" ]; then
            echo "Regenerated vocabulary snapshot is untracked or otherwise dirty:"
            echo "$status"
            exit 1
          fi

  python-test-shard:
    name: Python Test Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Match the runner's 4 vCPUs so each shard stays well inside the
      # 120-second budget (pytest-xdist reads this variable when `-n auto`
      # is used; at 2 workers shards measured 95-120s on CI).
      PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
      # Numerical evidence is a baseline obligation, not a change-detection
      # heuristic. The fixture path exercises the committed reference outputs
      # (the metadata-only manifest test has its own job below); the reconciler
      # and fast cross-engine cells prove the core comparison paths.
      PYTHON_SCIENTIFIC_PROOF_TEST_PATHS: >-
        tests/fixtures
        tests/research/parity/test_qc_reconciler.py
        tests/research/parity/test_cross_engine_study.py
    defaults:
      run:
        working-directory: PythonDataService
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonDataService/requirements*.txt
      - run: pip install -r requirements-heavy.txt -r requirements-light.txt -r requirements-dev.txt
      - name: Verify committed OpenAPI contract
        run: python scripts/export_openapi_contract.py --check

      # Curated fast baseline + diff-driven extras.
      # Baseline dirs always run; everything else only runs when the diff touches it
      # (either a tests/** file directly, or an app/**/<name>.py with a matching
      # tests/**/test_<name>.py). See discussion in PR introducing this step.
      - name: Compute change-driven extra test paths
        id: changed
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref }}"
            git fetch --no-tags --depth=200 origin "$base_ref" || git fetch --no-tags origin "$base_ref"
            base="origin/${base_ref}"
            range="${base}...HEAD"
          else
            # push to master: diff just the pushed commits
            range="${{ github.event.before }}...${{ github.sha }}"
            if ! git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1; then
              range="HEAD~1...HEAD"
            fi
          fi
          # Deleted sources cannot own tests in the current checkout and must not
          # contribute paths that pytest can no longer collect.
          changed=$(git diff --name-only --diff-filter=ACMRT "$range" || true)
          # Baseline and scientific-proof paths are always run; skip them here
          # to avoid duplicate collection through the change-driven extras.
          # The baseline comes from the runner itself so the two can't drift.
          mapfile -t baseline_dirs < <(cd PythonDataService && python -m scripts.run_fast_tests --list-baseline)
          read -r -a scientific_proof_paths <<< "$PYTHON_SCIENTIFIC_PROOF_TEST_PATHS"
          always_run_pattern=$(
            printf '%s\n' "${baseline_dirs[@]}" "${scientific_proof_paths[@]}" \
              | sed 's#^#PythonDataService/#' \
              | sed 's#[][(){}.^$*+?|\\]#\\&#g' \
              | paste -sd'|' -
          )
          always_run_pattern="^(${always_run_pattern})(/|$)"
          extra=""
          # (1) Directly-changed test files outside the always-run paths.
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              PythonDataService/tests/*test_*.py)
                if [[ ! "$p" =~ $always_run_pattern ]]; then
                  rel="${p#PythonDataService/}"
                  [ -f "PythonDataService/$rel" ] && extra="$extra $rel"
                fi
                ;;
            esac
          done <<< "$changed"
          # (2) Tests matching each changed app/**/<name>.py, plus explicit integration ownership.
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              PythonDataService/app/services/offline_replay_service.py|PythonDataService/app/services/offline_replay_data.py)
                extra="$extra tests/integration/test_offline_replay_market_capture.py"
                ;;
            esac
            case "$p" in
              PythonDataService/app/*.py)
                stem=$(basename "$p" .py)
                [ "$stem" = "__init__" ] && continue
                while IFS= read -r t; do
                  if [[ ! "PythonDataService/$t" =~ $always_run_pattern ]]; then
                    extra="$extra $t"
                  fi
                done < <(cd PythonDataService && find tests -type f \( -name "test_${stem}.py" -o -name "test_${stem}_*.py" \) 2>/dev/null || true)
                ;;
            esac
          done <<< "$changed"
          # Strip anything under tests/unit/data_lake or tests/integration/data_lake:
          # the "Run fast baseline" step's --ignore flags for those two directories
          # only suppress directory-walked collection, not an explicitly-passed file
          # path (verified: `pytest <file> --ignore=<file's dir>` still collects
          # <file> — a pytest --ignore is not retroactive over positional args). A
          # PR that directly edits a data-lake test file — e.g. one porting a
          # DataRunSpec field rename through every call site — makes rule (1) above
          # add that file to $extra, which used to slip it past both --ignore flags
          # and into the parallel run, exposing the TRUNCATE-based clean_artifacts
          # race the ignores exist to prevent (see the comment on that step).
          extra=$(echo "$extra" | tr ' ' '\n' | awk 'NF' | sort -u | { grep -v -E '^tests/(unit|integration)/data_lake/' || true; } | tr '\n' ' ')
          echo "extra=${extra}" >> "$GITHUB_OUTPUT"
          echo "Extra change-driven test paths: ${extra:-<none>}"

      # The checked-in runner owns the baseline, marker filter, xdist settings,
      # database exclusions, and a hard 120-second wall-clock budget. Expensive
      # corpus regeneration and PostgreSQL-backed coverage run daily instead.
      - name: Run fast baseline + change-driven tests
        run: |
          extra="${{ steps.changed.outputs.extra }}"
          extra_paths=()
          if [ -n "$extra" ]; then
            read -r -a extra_paths <<< "$extra"
          fi
          python -m scripts.run_fast_tests --shard "${{ matrix.shard }}/4" "${extra_paths[@]}"

      - name: Run scientific proof tests
        run: |
          read -r -a scientific_proof_paths <<< "$PYTHON_SCIENTIFIC_PROOF_TEST_PATHS"
          python -m pytest "${scientific_proof_paths[@]}" --ignore=tests/fixtures/test_golden_manifest.py -n auto -v -m "not slow" --tb=short

  python-test:
    name: Python Tests
    if: ${{ always() }}
    needs: python-test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python shard to pass
        if: ${{ needs.python-test-shard.result != 'success' }}
        run: exit 1

  alpaca-sqlite-qualification-smoke:
    name: Alpaca SQLite Qualification Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonDataService
    env:
      POLYGON_API_KEY: test-key-for-testing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonDataService/requirements*.txt
      - run: pip install -r requirements-heavy.txt -r requirements-light.txt -r requirements-dev.txt
      - name: Run bounded deterministic qualification
        run: |
          mkdir -p TestResults
          timeout --signal=KILL 120s python -m scripts.run_alpaca_sqlite_qualification \
            --profile smoke \
            --json-output TestResults/alpaca-sqlite-qualification-smoke.json \
            --markdown-output TestResults/alpaca-sqlite-qualification-smoke.md
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-sqlite-qualification-smoke
          path: PythonDataService/TestResults/alpaca-sqlite-qualification-smoke.*
          if-no-files-found: error

  validate-golden-manifest:
    name: Validate Golden Manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonDataService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonDataService/requirements*.txt
      - run: pip install pydantic jsonschema pyarrow pytest
      - run: timeout --signal=KILL 120s python -m pytest tests/fixtures/test_golden_manifest.py -v --tb=short --noconftest
