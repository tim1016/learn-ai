# Test-only overlay for scripts.run_broker_fleet_compose_qualification.
# Coordinator and clerk services intentionally retain their production image,
# command, and fleet roles. Only the external provider/market endpoints below
# are fake; they are not present in the production topology.
services:
  # Qualification has isolated support stores so it never joins an operator's
  # base stack. Production gets db/redis from compose.yaml instead.
  fleet-db:
    image: docker.io/library/postgres:16
    profiles: ["fleet-qualification"]
    environment:
      POSTGRES_PASSWORD: qualification-postgres-password
    volumes:
      - fleet-coordinator-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [fleet-private]

  fleet-redis:
    image: docker.io/library/redis:7-alpine
    profiles: ["fleet-qualification"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [fleet-private]

  # A host-ceremony helper only. It uses the real provisioning CLI against all
  # three scoped volumes before the actual roles start; it is not a runtime.
  fleet-qualification-enroller:
    image: ${FLEET_IMAGE:-learn-ai-fleet-agent:local}
    profiles: ["fleet-qualification"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      POLYGON_API_KEY: ""
      FLEET_POSTGRES_PASSWORD: qualification-postgres-password
    volumes:
      - fleet-coordinator-control:/app/artifacts/fleet
      - fleet-coordinator-lake:/lean-data-writer
      - fleet-alpaca-paper-data:/app/artifacts/clerks/paper
      - fleet-alpaca-live-data:/app/artifacts/clerks/live
    networks: [fleet-private]

  fleet-coordinator:
    profiles: ["fleet-qualification"]
    depends_on: !override
      fleet-db:
        condition: service_healthy
      fleet-redis:
        condition: service_healthy
    environment:
      NUMBA_DISABLE_JIT: "1"
      POLYGON_API_KEY: qualification-polygon-placeholder
    volumes: !override
      - fleet-coordinator-control:/app/artifacts/fleet
      - fleet-coordinator-artifacts:/app/artifacts
      - fleet-coordinator-cache:/app/cache
      - fleet-coordinator-reference-data:/lean-data:ro
      - fleet-coordinator-lean-cache:/lean-cache
      - fleet-coordinator-lake:/lean-data-writer
    stop_grace_period: 2s

  alpaca-paper-clerk:
    profiles: ["fleet-qualification"]
    # Preserve the first startup-refusal exit for bounded inspection instead
    # of hiding it behind the production restart policy.
    restart: "no"
    # The harness performs explicit bounded health probes. Disable the
    # periodic probe so it cannot consume Paper's deliberately one-slot
    # request pool during capacity contention.
    healthcheck:
      disable: true
    environment:
      NUMBA_DISABLE_JIT: "1"
      FLEET_FAKE_BROKER_URL: http://fleet-fake-paper-provider:8011
      FLEET_FAKE_MARKET_DATA_URL: http://fleet-fake-market-data:8013
      FLEET_QUALIFICATION_ACCOUNT_MODE: paper
      FLEET_MAX_INFLIGHT_REQUESTS: "1"
      FLEET_MAX_INFLIGHT_STREAMS: "1"
      FLEET_REQUEST_QUEUE_LIMIT: "0"
      FLEET_REQUEST_QUEUE_TIMEOUT_MS: "0"
    stop_grace_period: 2s
    volumes:
      - ./PythonDataService/scripts/run_broker_fleet_compose_qualification.py:/app/scripts/run_broker_fleet_compose_qualification.py:ro
    depends_on:
      fleet-fake-paper-provider:
        condition: service_healthy
      fleet-fake-market-data:
        condition: service_healthy

  alpaca-live-clerk:
    profiles: ["fleet-qualification"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      NUMBA_DISABLE_JIT: "1"
      FLEET_FAKE_BROKER_URL: http://fleet-fake-live-provider:8012
      FLEET_FAKE_MARKET_DATA_URL: http://fleet-fake-market-data:8013
      FLEET_QUALIFICATION_ACCOUNT_MODE: live
    stop_grace_period: 2s
    volumes:
      - ./PythonDataService/scripts/run_broker_fleet_compose_qualification.py:/app/scripts/run_broker_fleet_compose_qualification.py:ro
    depends_on:
      fleet-fake-live-provider:
        condition: service_healthy
      fleet-fake-market-data:
        condition: service_healthy

  fleet-fake-paper-provider:
    image: ${FLEET_IMAGE:-learn-ai-fleet-agent:local}
    profiles: ["fleet-qualification"]
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "/app/scripts/run_broker_fleet_compose_qualification.py", "--container-role", "fake-provider"]
    environment: { FLEET_PROBE_PROVIDER: paper }
    volumes:
      - ./PythonDataService/scripts/run_broker_fleet_compose_qualification.py:/app/scripts/run_broker_fleet_compose_qualification.py:ro
    networks: [fleet-private]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/run_broker_fleet_compose_qualification.py", "--health-url", "http://localhost:8011/health"]
      interval: 2s
      timeout: 2s
      retries: 10

  fleet-fake-live-provider:
    image: ${FLEET_IMAGE:-learn-ai-fleet-agent:local}
    profiles: ["fleet-qualification"]
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "/app/scripts/run_broker_fleet_compose_qualification.py", "--container-role", "fake-provider"]
    environment: { FLEET_PROBE_PROVIDER: live }
    volumes:
      - ./PythonDataService/scripts/run_broker_fleet_compose_qualification.py:/app/scripts/run_broker_fleet_compose_qualification.py:ro
    networks: [fleet-private]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/run_broker_fleet_compose_qualification.py", "--health-url", "http://localhost:8012/health"]
      interval: 2s
      timeout: 2s
      retries: 10

  fleet-fake-market-data:
    image: ${FLEET_IMAGE:-learn-ai-fleet-agent:local}
    profiles: ["fleet-qualification"]
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "/app/scripts/run_broker_fleet_compose_qualification.py", "--container-role", "fake-market-data"]
    volumes:
      - ./PythonDataService/scripts/run_broker_fleet_compose_qualification.py:/app/scripts/run_broker_fleet_compose_qualification.py:ro
    networks: [fleet-private]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/run_broker_fleet_compose_qualification.py", "--health-url", "http://localhost:8013/health"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  fleet-coordinator-postgres:
  fleet-coordinator-cache:
  fleet-coordinator-reference-data:
  fleet-coordinator-lean-cache:
  fleet-coordinator-lake:
